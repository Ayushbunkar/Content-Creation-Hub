  <style>

    const CATEGORIES = [

    const CAPTION_TEMPLATES = [
      { id: 'minimal-white', name: 'Minimal White', desc: 'Clean white typography with subtle shadow, two-line layout.' },
      { id: 'bold-keyword', name: 'Bold Keyword', desc: 'Large bold typography with key concepts highlighted in accent color.' },

    // ==========================================
    // ==========================================
    // RETRO ARCADE FLAPPY BIRD (STUDIO EDITION)
    // Play while AI pipeline or render is running
    // ==========================================
    function FlappyBirdGame() {
      const canvasRef = React.useRef(null);
      const jumpRef = React.useRef(() => {});
      const [score, setScore] = React.useState(0);
      const [highScore, setHighScore] = React.useState(() => {
        try { return parseInt(localStorage.getItem('flappy_hs') || '0', 10); } catch (e) { return 0; }
      });
      const highScoreRef = React.useRef(highScore);
      highScoreRef.current = highScore;

      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const gravity = 0.22;
        const jumpPower = -5.0;
        const maxFallSpeed = 6.2;
        const gap = 126;
        const groundY = H - 36;
        const hitboxMargin = 4;

        let bird = { x: 60, y: H / 2 - 20, vy: 0, r: 12, rot: 0 };
        let pipes = [];
        let particles = [];
        let frame = 0;
        let localScore = 0;
        let state = 'idle'; // 'idle', 'playing', 'over'
        let deathTime = 0;
        let animId;

        const resetGame = () => {
          bird = { x: 60, y: H / 2 - 25, vy: jumpPower * 0.85, r: 12, rot: -0.2 };
          pipes = [];
          particles = [];
          frame = 0;
          localScore = 0;
          setScore(0);
          state = 'playing';
        };

        const jumpBird = () => {
          const now = Date.now();
          if (state === 'idle') {
            resetGame();
          } else if (state === 'over') {
            // Prevent accidental instant restart within 250ms of dying
            if (now - deathTime > 250) {
              resetGame();
            }
          } else if (state === 'playing') {
            bird.vy = jumpPower;
            // Spawn little wind particles
            for (let i = 0; i < 3; i++) {
              particles.push({
                x: bird.x - 10,
                y: bird.y + (Math.random() * 8 - 4),
                vx: -1.5 - Math.random(),
                vy: Math.random() * 1.5 - 0.75,
                alpha: 0.8,
                color: '#fbbf24'
              });
            }
          }
        };

        jumpRef.current = jumpBird;

        const loop = () => {
          frame++;
          ctx.clearRect(0, 0, W, H);

          // 1. Retro Night Sky Gradient
          const grad = ctx.createLinearGradient(0, 0, 0, H);
          grad.addColorStop(0, '#0a0d17');
          grad.addColorStop(0.65, '#1e1b4b');
          grad.addColorStop(1, '#020617');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, W, H);

          // Starfield
          ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
          for (let s = 0; s < 22; s++) {
            const sx = ((s * 43) + (frame * 0.25)) % W;
            const sy = (s * 31) % (groundY - 30);
            ctx.fillRect(sx, sy, 1.5, 1.5);
          }

          // 2. Pipes & Collisions
          if (state === 'playing') {
            // First pipe spawns after frame 85, then every 95 frames
            if (frame > 85 && (frame - 85) % 95 === 0) {
              const minTop = 35;
              const maxTop = groundY - gap - 40;
              const topH = minTop + Math.random() * (maxTop - minTop);
              pipes.push({ x: W, top: topH, passed: false });
            }

            // Update bird physics
            bird.vy += gravity;
            if (bird.vy > maxFallSpeed) bird.vy = maxFallSpeed;
            bird.y += bird.vy;
            bird.rot = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.vy * 0.12));

            // Ceiling clamp (Do NOT kill on ceiling)
            if (bird.y - bird.r < 0) {
              bird.y = bird.r;
              bird.vy = 0;
            }

            // Ground collision
            if (bird.y + bird.r >= groundY) {
              bird.y = groundY - bird.r;
              state = 'over';
              deathTime = Date.now();
            }
          } else if (state === 'idle') {
            bird.y = H / 2 + Math.sin(frame * 0.08) * 8;
            bird.rot = 0;
          }

          // Render & check pipes
          for (let i = pipes.length - 1; i >= 0; i--) {
            const p = pipes[i];
            if (state === 'playing') {
              p.x -= 2.0;
            }

            const bottomY = p.top + gap;
            const bottomH = groundY - bottomY;

            // Score pass check
            if (state === 'playing' && !p.passed && p.x + 44 < bird.x) {
              p.passed = true;
              localScore++;
              setScore(localScore);
              const newHs = Math.max(highScoreRef.current, localScore);
              setHighScore(newHs);
              try { localStorage.setItem('flappy_hs', newHs.toString()); } catch (e) {}

              // Golden star burst on score
              for (let k = 0; k < 6; k++) {
                particles.push({
                  x: bird.x,
                  y: bird.y,
                  vx: (Math.random() - 0.5) * 4,
                  vy: (Math.random() - 0.5) * 4,
                  alpha: 1.0,
                  color: '#facc15'
                });
              }
            }

            // Draw Pipes (Retro arcade green with highlight & rim)
            // Top pipe
            ctx.fillStyle = '#15803d';
            ctx.fillRect(p.x, 0, 44, p.top);
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(p.x + 3, 0, 5, p.top);
            ctx.fillStyle = '#166534';
            ctx.fillRect(p.x - 3, p.top - 18, 50, 18);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(p.x - 1, p.top - 16, 5, 14);

            // Bottom pipe
            ctx.fillStyle = '#15803d';
            ctx.fillRect(p.x, bottomY, 44, bottomH);
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(p.x + 3, bottomY, 5, bottomH);
            ctx.fillStyle = '#166534';
            ctx.fillRect(p.x - 3, bottomY, 50, 18);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(p.x - 1, bottomY + 2, 5, 14);

            // Forgiving hitbox collision check
            if (state === 'playing') {
              const birdRight = bird.x + bird.r - hitboxMargin;
              const birdLeft = bird.x - bird.r + hitboxMargin;
              const pipeRight = p.x + 44;
              const pipeLeft = p.x;

              if (birdRight > pipeLeft && birdLeft < pipeRight) {
                const birdTop = bird.y - bird.r + hitboxMargin;
                const birdBottom = bird.y + bird.r - hitboxMargin;

                if (birdTop < p.top || birdBottom > bottomY) {
                  state = 'over';
                  deathTime = Date.now();
                }
              }
            }

            if (p.x < -60) pipes.splice(i, 1);
          }

          // 3. Ground (Animated scrolling pattern)
          ctx.fillStyle = '#064e3b';
          ctx.fillRect(0, groundY, W, 36);
          ctx.fillStyle = '#10b981';
          ctx.fillRect(0, groundY, W, 4);

          // Moving grass stripes
          ctx.fillStyle = '#047857';
          const grassOffset = state === 'playing' ? (frame * 2.0) % 18 : 0;
          for (let gx = -grassOffset; gx < W + 18; gx += 18) {
            ctx.fillRect(gx, groundY + 4, 9, 32);
          }

          // 4. Particles (Jump air & score bursts)
          for (let pi = particles.length - 1; pi >= 0; pi--) {
            const pt = particles[pi];
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.alpha -= 0.035;
            if (pt.alpha <= 0) {
              particles.splice(pi, 1);
              continue;
            }
            ctx.save();
            ctx.globalAlpha = Math.max(0, pt.alpha);
            ctx.fillStyle = pt.color;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // 5. Draw Flappy Bird
          ctx.save();
          ctx.translate(bird.x, bird.y);
          ctx.rotate(bird.rot);

          // Body (Vibrant Golden Yellow)
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#0f172a';
          ctx.stroke();

          // Wing (Flapping animation)
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          const wingFlap = state === 'playing' && bird.vy < 0 ? -4 : Math.sin(frame * 0.28) * 3;
          ctx.ellipse(-4, wingFlap, 6, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Eye & Pupil
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(4, -4, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(5.5, -4, 2, 0, Math.PI * 2);
          ctx.fill();

          // Beak
          ctx.fillStyle = '#ea580c';
          ctx.beginPath();
          ctx.moveTo(8, -2);
          ctx.lineTo(16, 1.5);
          ctx.lineTo(8, 5);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.restore();

          // 6. HUD / Overlay State
          if (state === 'playing') {
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 32px monospace';
            ctx.textAlign = 'center';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;
            ctx.strokeText(localScore.toString(), W / 2, 48);
            ctx.fillText(localScore.toString(), W / 2, 48);
          } else if (state === 'idle') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(0, 0, W, H);

            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 22px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('FLAPPY BIRD', W / 2, H / 2 - 45);

            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 13px sans-serif';
            ctx.fillText('Tap Screen or Press SPACE to Start', W / 2, H / 2 + 35);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '11px sans-serif';
            ctx.fillText('Timepass while your video processes!', W / 2, H / 2 + 58);
          } else if (state === 'over') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
            ctx.fillRect(0, 0, W, H);

            ctx.fillStyle = '#f43f5e';
            ctx.font = 'bold 26px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', W / 2, H / 2 - 42);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText(`Score: ${localScore}`, W / 2, H / 2 - 8);

            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 13px sans-serif';
            ctx.fillText(`Best: ${Math.max(highScoreRef.current, localScore)}`, W / 2, H / 2 + 16);

            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 13px sans-serif';
            ctx.fillText('Tap or Press SPACE to Play Again', W / 2, H / 2 + 55);
          }

          animId = requestAnimationFrame(loop);
        };

        animId = requestAnimationFrame(loop);

        const onKeyDown = (e) => {
          if (['INPUT', 'TEXTAREA'].includes(e.target?.tagName)) return;
          if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            jumpBird();
          }
        };
        window.addEventListener('keydown', onKeyDown);

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('keydown', onKeyDown);
        };
      }, []);

      return (
        <div class="flex flex-col items-center justify-center p-5 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl space-y-3 select-none">
          <div class="flex items-center justify-between w-full max-w-[340px] px-1">
            <div class="flex items-center space-x-2">
              <span class="text-base">🎮</span>
              <span class="text-xs font-bold uppercase tracking-wider text-amber-400">Flappy Timepass Mini-Game</span>
            </div>
            <div class="text-[11px] font-mono text-slate-400">
              Score: <strong class="text-white">{score}</strong> | Best: <strong class="text-amber-300">{highScore}</strong>
            </div>
          </div>

          <div
            onPointerDown={(e) => {
              e.preventDefault();
              jumpRef.current();
            }}
            class="relative rounded-xl overflow-hidden border-2 border-indigo-900/60 shadow-2xl cursor-pointer hover:border-indigo-500 transition active:scale-[0.99]"
          >
            <canvas
              ref={canvasRef}
              width={340}
              height={360}
              class="block"
            />
          </div>

          <p class="text-[11px] text-slate-400 text-center">
            Tap on screen or press <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono text-[10px]">SPACE</kbd> or <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono text-[10px]">↑</kbd> to flap & dodge pipes!
          </p>
        </div>
      );
    }

    function App() {
      const [currentTab, setCurrentTab] = useState('captions'); // Default to Caption Studio
      const [projects, setProjects] = useState([]);
      const [curatedTopics, setCuratedTopics] = useState([]);
      const [activeProject, setActiveProject] = useState(null);

      // AI Generator Form State
      const [selectedCategory, setSelectedCategory] = useState(CATEGORIES[0].id);
      const [promptTopic, setPromptTopic] = useState('');
      const [duration, setDuration] = useState(60);
      const [language, setLanguage] = useState('English');
      const [voice, setVoice] = useState('af_heart');
      const [aspectRatio, setAspectRatio] = useState('16:9');
      const [pipelineResolution, setPipelineResolution] = useState('1080p');
      const [captionTemplate, setCaptionTemplate] = useState('minimal-white');
      const [isGenerating, setIsGenerating] = useState(false);

      const [enhancementFps, setEnhancementFps] = useState(60);

      const [fastShiftIntensity, setFastShiftIntensity] = useState('vox_dynamic');
      const [selectedColorProfile, setSelectedColorProfile] = useState('cinematic_documentary');
      const [renderQualityPreset, setRenderQualityPreset] = useState('high_quality');
      const [superResScale, setSuperResScale] = useState(2);
      const [qcInspectionData, setQcInspectionData] = useState(null);
      const [isInspectingQc, setIsInspectingQc] = useState(false);
      const [sampleImagePath, setSampleImagePath] = useState('/videos/library/intel_seal.png');
      const [imageMetrics, setImageMetrics] = useState(null);
      const [enhancedImageUrl, setEnhancedImageUrl] = useState(null);
      const [isEnhancingImage, setIsEnhancingImage] = useState(false);

      // ================= SCENE TIMELINE & QUALITY STATE ================= //
      const [projectScenes, setProjectScenes] = useState([]);
      const [mediaLibrary, setMediaLibrary] = useState([]);
      const [qualityReport, setQualityReport] = useState(null);
      const [isQualityChecking, setIsQualityChecking] = useState(false);
      const [selectedShotId, setSelectedShotId] = useState(null);
      const [editingShot, setEditingShot] = useState(null);

      // ================= CAPTION STUDIO STATE ================= //
      const [capProjects, setCapProjects] = useState([]);
      const [activeCapProject, setActiveCapProject] = useState(null);
      const [capStudioTab, setCapStudioTab] = useState('editor'); // editor, templates, customize, export
      const [isUploading, setIsUploading] = useState(false);

      const [transcribeModel, setTranscribeModel] = useState('base');
      const [transcribeLang, setTranscribeLang] = useState('auto');

      // Video Player & Preview State
      const videoRef = useRef(null);
      const [videoCurrentTime, setVideoCurrentTime] = useState(0);
      const [videoDuration, setVideoDuration] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [playbackRate, setPlaybackRate] = useState(1);
      const [aspectRatioPreview, setAspectRatioPreview] = useState('16:9'); // 16:9, 9:16, 1:1, 4:5

      // Transcript Editor Search & Undo State
      const [searchTerm, setSearchTerm] = useState('');
      const [replaceTerm, setReplaceTerm] = useState('');
      const [undoStack, setUndoStack] = useState([]);
      const [redoStack, setRedoStack] = useState([]);
      const [activeWordIndex, setActiveWordIndex] = useState(-1);

      // Custom Styling State
      const [customStyle, setCustomStyle] = useState({
        fontFamily: 'Inter',
        fontSize: 48,
        fontWeight: '700',
        color: '#FFFFFF',
        highlightColor: '#FFD700',
        bgColor: '#000000',
        bgOpacity: 0.6,
        outlineWidth: 3,
        outlineColor: '#000000',

        alignment: 'center',

      });

      // Video Settings (Trim & Audio)
      const [videoSettings, setVideoSettings] = useState({
        trim_start: 0,
        trim_end: 0,

        bgm_volume: 0.15,
        bgm_track: 'none'
      });

      // Resolution, BGM & Batch Export State
      const [exportResolution, setExportResolution] = useState('1080p');
      const [selectedBgmTrack, setSelectedBgmTrack] = useState('none');
      const [isAutoSplitting, setIsAutoSplitting] = useState(false);

      // Export State
      const [isExporting, setIsExporting] = useState(false);
      const [exportProgress, setExportProgress] = useState(0);
      const [exportedVideoUrl, setExportedVideoUrl] = useState(null);
      const [outputClips, setOutputClips] = useState([]);

      // ================= AI VIRAL CLIPPER STATE ================= //
      const [clipperProjects, setClipperProjects] = useState([]);
      const [activeClipperProject, setActiveClipperProject] = useState(null);
      const [clipperClips, setClipperClips] = useState([]);
      const [selectedClip, setSelectedClip] = useState(null);
      const [clipperFilter, setClipperFilter] = useState('all'); // all, viral, category
      const [clipperCategoryFilter, setClipperCategoryFilter] = useState('all');

      // Clipper Input Form State
      const [clipperSourceType, setClipperSourceType] = useState('youtube'); // youtube, upload, local
      const [clipperUrl, setClipperUrl] = useState('');
      const [clipperTargetDuration, setClipperTargetDuration] = useState('30-60'); // 15-30, 30-60, 60-90
      const [clipperClipCount, setClipperClipCount] = useState(5);
      const [clipperLanguage, setClipperLanguage] = useState('auto');
      const [clipperSelectedLocal, setClipperSelectedLocal] = useState('');

      // Clipper Processing & Progress State
      const [isClipperBusy, setIsClipperBusy] = useState(false);
      const [clipperStage, setClipperStage] = useState(''); // downloading, extracting, transcribing, detecting, ready, rendering
      const [clipperProgress, setClipperProgress] = useState(0);
      const [clipperStatusMessage, setClipperStatusMessage] = useState('');
      const [clipperError, setClipperError] = useState(null);

      // Fetch all Clipper projects

      // Load specific Clipper project and its clips

      // ================= DOCUMENTARY STUDIO STATE ================= //

      // Start new clipping project from YouTube URL or Local File
      const handleCreateClipperProject = async () => {
        if (clipperSourceType === 'youtube' && !clipperUrl.trim()) {
          alert('Please enter a valid YouTube or Podcast URL');
          return;
        }
        if (clipperSourceType === 'local' && !clipperSelectedLocal) {
          alert('Please select a local video from the list');
          return;
        }

        setIsClipperBusy(true);
        setClipperError(null);
        setClipperStage(clipperSourceType === 'youtube' ? 'downloading' : 'extracting');
        setClipperProgress(10);
        setClipperStatusMessage('Initializing source ingestion...');

        try {
          const body = {
            sourceType: clipperSourceType,
            url: clipperSourceType === 'youtube' ? clipperUrl.trim() : null,
            localPath: clipperSourceType === 'local' ? clipperSelectedLocal : null,
            targetDuration: clipperTargetDuration,
            clipCountTarget: parseInt(clipperClipCount, 10),
            language: clipperLanguage
          };

          const res = await fetch('/api/clipper/projects/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const data = await res.json();
          if (data.error) {
            setIsClipperBusy(false);
            setClipperError(data.error);
            alert('Clipper error: ' + data.error);
            return;
          }

          await fetchClipperProjects();
          if (data.id) {
            loadClipperProject(data.id);
          }
        } catch (err) {
          setIsClipperBusy(false);
          setClipperError(err.message);
          alert('Failed to start clipper: ' + err.message);
        }
      };

      // Upload local video for clipping
      const handleClipperFileUpload = (file) => {
        if (!file) return;
        setIsClipperBusy(true);
        setClipperError(null);
        setClipperStage('downloading');
        setClipperProgress(15);
        setClipperStatusMessage(`Uploading "${file.name}" to local studio...`);

        const xhr = new XMLHttpRequest();
        const url = `/api/clipper/upload?filename=${encodeURIComponent(file.name)}`;

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const pct = Math.round((e.loaded / e.total) * 60);
            setClipperProgress(15 + pct);
          }
        };

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              const res = JSON.parse(xhr.responseText);
              fetchClipperProjects();
              if (res.id) loadClipperProject(res.id);
            } catch (err) {
              setClipperError('Failed to parse upload response: ' + err.message);
              setIsClipperBusy(false);
            }
          } else {
            setClipperError('Upload failed with status ' + xhr.status);
            setIsClipperBusy(false);
          }
        };

        xhr.onerror = () => {
          setClipperError('Network error uploading video');
          setIsClipperBusy(false);
        };

        xhr.open('POST', url, true);
        xhr.setRequestHeader('Content-Type', 'application/octet-stream');
        xhr.send(file);
      };

      // Update selected clip parameters

          });
          const data = await res.json();
          if (data.clip) {
            setSelectedClip(data.clip);
            setClipperClips(prev => prev.map(c => c.id === data.clip.id ? data.clip : c));

      };

          const res = await fetch(`/api/clipper/clips/${id}/render`, { method: 'POST' });
          const data = await res.json();

          } else if (data.error) {

          const res = await fetch(`/api/clipper/projects/${activeClipperProject.id}/batch-render`, { method: 'POST' });
          const data = await res.json();
          setIsBatchRendering(false);

          alert(`Batch render complete! ${data.results ? data.results.length : 0} vertical reels exported.`);

      // 1-Click Bridge to open clip in Caption Studio

          const data = await res.json();
          if (data.captionProject) {
            await fetchCaptionProjects();
            selectCaptionProject(data.captionProject);
            setCurrentTab('captions');
          } else if (data.error) {
            alert('Could not bridge to Caption Studio: ' + data.error);
          }
        } catch (e) {
          alert('Error: ' + e.message);
        }
      };

      // Load Projects, Outputs and Curated Topics
      const fetchOutputClips = async () => {

          const res = await fetch('/api/media/outputs');
          const data = await res.json();

      const fetchProjects = async () => {

      const fetchCurated = async () => {

      const handleReRenderProject = async () => {
        if (!activeProject?.id) return;
        try {
          await fetch(`/api/projects/${activeProject.id}/render`, { method: 'POST' });
          setCurrentTab('progress');
        } catch (e) { console.error('Re-render failed:', e); }
      };

      useEffect(() => {
        if (activeProject?.id) {
          fetchProjectScenes(activeProject.id);
        }
      }, [activeProject?.id]);

      useEffect(() => {
        fetchMediaLibrary();
      }, []);

      useEffect(() => {
        fetchProjects();
        fetchCurated();
        fetchCaptionProjects();
        fetchOutputClips();
        fetchClipperProjects();
        fetchDocProjects();

        // WebSocket for live generation & transcription updates
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);
        ws.onmessage = (evt) => {
          try {
            const msg = JSON.parse(evt.data);
            if (msg.type === 'PIPELINE_UPDATE') {
              fetchProjects();
              fetchDocProjects();
              if (msg.data && msg.data.projectId) {
                if (activeDocProject && activeDocProject.id === msg.data.projectId) {
                  loadDocProject(msg.data.projectId);
                }
                setActiveProject((prev) => {
                  if (prev && prev.id === msg.data.projectId) {
                    return {
                      ...prev,
                      current_stage: msg.data.stage || prev.current_stage,
                      progress: msg.data.progress !== undefined ? msg.data.progress : prev.progress,
                      status: msg.data.status || prev.status,
                      error_message: msg.data.error_message !== undefined ? msg.data.error_message : prev.error_message
                    };
                  }
                  return prev;
                });
              }
            } else if (msg.type === 'CLIPPER_UPDATE') {
              fetchClipperProjects();
              if (msg.data.stage) {
                setClipperStage(msg.data.stage);
                if (msg.data.progress) setClipperProgress(msg.data.progress);
                if (msg.data.message) setClipperStatusMessage(msg.data.message);
                if (msg.data.stage === 'ready') {
                  setClipperError(null);
                  setIsClipperBusy(false);
                  if (activeClipperProject) loadClipperProject(activeClipperProject.id);
                }
              }
              if (msg.data.status === 'ready') {
                setClipperError(null);
                setIsClipperBusy(false);
                if (activeClipperProject) loadClipperProject(activeClipperProject.id);
              }
            } else if (msg.type === 'CAPTION_STUDIO_UPDATE') {
              fetchCaptionProjects();
              if (activeCapProject && activeCapProject.id === msg.data.projectId) {
                if (msg.data.status === 'transcribing') {
                  setIsTranscribing(true);
                  setTranscribeProgress(msg.data.progress || 50);
                } else if (msg.data.status === 'ready') {
                  setIsTranscribing(false);
                  setTranscribeProgress(100);
                  // Refresh active project data
                  fetch(`/api/caption-studio/projects/${activeCapProject.id}`)
                    .then(r => r.json())
                    .then(p => selectCaptionProject(p));
                } else if (msg.data.status === 'exporting') {
                  setIsExporting(true);
                  setExportProgress(msg.data.progress || 50);
                } else if (msg.data.status === 'completed') {
                  setIsExporting(false);
                  setExportProgress(100);
                  if (msg.data.videoUrl) setExportedVideoUrl(msg.data.videoUrl);
                }
              }
            }
          } catch (e) { }
        };
        return () => ws.close();
      }, []);

      // Auto-poll pipeline when on progress tab or project is generating
      React.useEffect(() => {
        if (currentTab === 'progress' || (activeProject && activeProject.status === 'processing')) {
          const timer = setInterval(() => {
            fetchProjects();
          }, 2000);
          return () => clearInterval(timer);
        }
      }, [currentTab, activeProject?.id, activeProject?.status]);

      // File Upload Handler (Drag & Drop or File Picker)
      const handleFileUpload = (file) => {
        if (!file) return;
        setIsUploading(true);
        setUploadProgress(10);
        setUploadError(null);

        const xhr = new XMLHttpRequest();
        const url = `/api/caption-studio/upload?filename=${encodeURIComponent(file.name)}`;

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const pct = Math.round((e.loaded / e.total) * 90);
            setUploadProgress(Math.max(10, pct));
          }
        };

        xhr.onload = () => {
          setIsUploading(false);
          setUploadProgress(100);
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              const res = JSON.parse(xhr.responseText);
              fetchCaptionProjects();
              selectCaptionProject(res.project);
              // Prompt or auto-start transcription
              if (confirm(`Uploaded "${file.name}" successfully! Would you like to transcribe it now with local Whisper?`)) {
                triggerTranscription(res.id);
              }
            } catch (err) {
              setUploadError('Failed to parse upload response: ' + err.message);
            }
          } else {
            try {
              const err = JSON.parse(xhr.responseText);
              setUploadError(err.error || 'Upload failed');
            } catch (e) {
              setUploadError('Upload failed with status ' + xhr.status);
            }
          }
        };

        xhr.onerror = () => {
          setIsUploading(false);
          setUploadError('Network error during upload');
        };

        xhr.open('POST', url, true);
        xhr.setRequestHeader('Content-Type', 'application/octet-stream');
        xhr.send(file);
      };

      const triggerTranscription = async (projectId) => {
        const id = projectId || activeCapProject?.id;
        if (!id) return;
        setIsTranscribing(true);
        setTranscribeProgress(15);
        try {
          await fetch(`/api/caption-studio/${id}/transcribe`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ language: transcribeLang, model: transcribeModel })
          });
        } catch (e) {
          alert('Failed to trigger transcription: ' + e.message);
          setIsTranscribing(false);
        }
      };

      // Save Transcript & Project Edits with INSTANT LIVE OVERLAY SYNC (0ms latency, zero re-render)
      const saveProjectChanges = (updatedTranscript, updatedTemplate, updatedStyle, updatedSettings) => {
        if (!activeCapProject) return;
        const newTranscript = updatedTranscript || activeCapProject.transcript_json;
        const newTemplate = updatedTemplate || activeCapProject.caption_template;
        const newStyle = updatedStyle || customStyle;
        const newSettings = updatedSettings || videoSettings;

        // 1. Immediately update React state synchronously for instant live preview update
        setActiveCapProject(prev => ({
          ...prev,
          transcript_json: newTranscript,
          caption_template: newTemplate,
          custom_style: newStyle,
          video_settings: newSettings
        }));
        if (updatedStyle) setCustomStyle(newStyle);
        if (updatedSettings) setVideoSettings(newSettings);

        // 2. Persist to SQLite asynchronously in background (zero FFmpeg re-render, zero tokens, zero delay)
        const body = {
          transcript_json: newTranscript,
          caption_template: newTemplate,
          custom_style: newStyle,
          video_settings: newSettings
        };
        fetch(`/api/caption-studio/projects/${activeCapProject.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }).catch(e => console.error('Background save failed:', e));
      };

      // Undo / Redo for Transcript Edits
      const pushUndo = (newSegments) => {
        if (!activeCapProject) return;
        const currentSegments = activeCapProject.transcript_json?.segments || [];
        setUndoStack(prev => [...prev, currentSegments]);
        setRedoStack([]);
        const updated = {
          ...(activeCapProject.transcript_json || { language: 'en', duration: videoDuration || 0 }),
          segments: newSegments,
          text: newSegments.map(s => s.text).join(' ')
        };
        saveProjectChanges(updated);
      };

      const handleUndo = () => {
        if (undoStack.length === 0) return;
        const prev = undoStack[undoStack.length - 1];
        setUndoStack(u => u.slice(0, u.length - 1));
        setRedoStack(r => [...r, activeCapProject.transcript_json.segments]);
        const updated = { ...activeCapProject.transcript_json, segments: prev };
        saveProjectChanges(updated);
      };

      const handleRedo = () => {
        if (redoStack.length === 0) return;
        const next = redoStack[redoStack.length - 1];
        setRedoStack(r => r.slice(0, r.length - 1));
        setUndoStack(u => [...u, activeCapProject.transcript_json.segments]);
        const updated = { ...activeCapProject.transcript_json, segments: next };
        saveProjectChanges(updated);
      };

      // Find and Replace in Transcript
      const handleFindReplace = () => {
        if (!searchTerm || !activeCapProject?.transcript_json?.segments) return;
        const newSegments = activeCapProject.transcript_json.segments.map(seg => ({
          ...seg,
          text: seg.text.replaceAll(searchTerm, replaceTerm)
        }));
        pushUndo(newSegments);
        alert(`Replaced all occurrences of "${searchTerm}" with "${replaceTerm}".`);
      };

      // Video Controls
      const togglePlay = () => {
        if (!videoRef.current) return;
        if (videoRef.current.paused) {
          videoRef.current.play();
          setIsPlaying(true);
        } else {
          videoRef.current.pause();
          setIsPlaying(false);
        }
      };

      const seekTo = (seconds) => {
        if (!videoRef.current) return;
        videoRef.current.currentTime = Math.max(0, Math.min(seconds, videoDuration || 9999));
        setVideoCurrentTime(videoRef.current.currentTime);
      };

      const stepFrame = (frames) => {
        if (!videoRef.current) return;
        const frameTime = 1 / (activeCapProject?.file_info?.fps || 30);
        seekTo(videoRef.current.currentTime + frames * frameTime);
      };

      const handleRateChange = (rate) => {
        setPlaybackRate(rate);
        if (videoRef.current) videoRef.current.playbackRate = rate;
      };

      // Smooth 60 FPS Playhead & Subtitle Sync with requestAnimationFrame
      useEffect(() => {
        let animId;
        const syncPlayhead = () => {
          if (videoRef.current && !videoRef.current.paused) {
            setVideoCurrentTime(videoRef.current.currentTime);
            animId = requestAnimationFrame(syncPlayhead);
          }
        };
        if (isPlaying) {
          animId = requestAnimationFrame(syncPlayhead);
        }
        return () => {
          if (animId) cancelAnimationFrame(animId);
        };
      }, [isPlaying]);

      // Keyboard Transport Shortcuts (Space = Play/Pause, Arrows = Seek, J/K/L = Pro Deck)
      useEffect(() => {
        const onKeyDown = (e) => {
          if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target?.tagName)) return;
          if (e.code === 'Space') {
            e.preventDefault();
            togglePlay();
          } else if (e.code === 'ArrowLeft') {
            e.preventDefault();
            seekTo(videoCurrentTime - 2);
          } else if (e.code === 'ArrowRight') {
            e.preventDefault();
            seekTo(videoCurrentTime + 2);
          } else if (e.code === 'KeyJ') {
            seekTo(videoCurrentTime - 5);
          } else if (e.code === 'KeyK') {
            togglePlay();
          } else if (e.code === 'KeyL') {
            seekTo(videoCurrentTime + 5);
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [videoCurrentTime, isPlaying, videoDuration]);

      // Export Trigger (1080p / 4K / 720p)
      const handleExport = async (burnCaptions = true, customAr = null) => {
        if (!activeCapProject) return;
        setIsExporting(true);
        setExportProgress(15);
        setExportedVideoUrl(null);
        try {
          await fetch(`/api/caption-studio/projects/${activeCapProject.id}/export`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              aspect_ratio: customAr || aspectRatioPreview,
              resolution: exportResolution,
              burn_captions: burnCaptions,
              bgm_track: selectedBgmTrack,
              bgm_volume: videoSettings.bgm_volume,
              original_volume: videoSettings.original_volume
            })
          });
        } catch (e) {
          alert('Export failed to start: ' + e.message);
          setIsExporting(false);
        }
      };

      // Dual Batch Export (16:9 + 9:16 simultaneously)
      const handleBatchExport = async () => {
        if (!activeCapProject) return;
        setIsExporting(true);
        setExportProgress(10);
        try {
          await fetch(`/api/caption-studio/projects/${activeCapProject.id}/batch-export`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              resolution: exportResolution,
              bgm_track: selectedBgmTrack,
              bgm_volume: videoSettings.bgm_volume,
              original_volume: videoSettings.original_volume
            })
          });
          alert(`Batch render initiated for both 16:9 Landscape & 9:16 Vertical at ${exportResolution}!`);
        } catch (e) {
          alert('Batch export failed: ' + e.message);
          setIsExporting(false);
        }
      };

      // Auto-Split long cards into snappy 5-6 word cards
      const handleAutoSplit = async () => {
        if (!activeCapProject) return;
        setIsAutoSplitting(true);
        try {
          const res = await fetch(`/api/caption-studio/projects/${activeCapProject.id}/auto-split`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ maxWords: 6 })
          });
          const data = await res.json();
          if (data.transcript) {
            selectCaptionProject({ ...activeCapProject, transcript_json: data.transcript });
          }
        } catch (e) {
          alert('Auto-split failed: ' + e.message);
        } finally {
          setIsAutoSplitting(false);
        }
      };

      // Active Caption Segment & Word Resolution
      const segments = activeCapProject?.transcript_json?.segments || [];
      const activeSeg = segments.find(s => videoCurrentTime >= s.start && videoCurrentTime <= s.end);

      // Render Synchronized Live Caption Overlay
      const renderLiveOverlay = () => {
        if (!activeSeg) return null;
        const template = activeCapProject?.caption_template || 'minimal-white';
        const s = customStyle;

        const baseStyle = {
          fontFamily: s.fontFamily,
          fontSize: `${Math.round(s.fontSize * (aspectRatioPreview === '9:16' ? 0.8 : 0.65))}px`,
          fontWeight: s.fontWeight,
          color: s.color,
          letterSpacing: `${s.letterSpacing}px`,
          lineHeight: s.lineHeight,
          textAlign: s.alignment,
          marginBottom: `${s.verticalOffset}px`
        };

        if (template === 'minimal-white') {
          return (
            <div style={{ ...baseStyle, textShadow: '0 2px 10px rgba(0,0,0,0.9)' }} class="font-bold px-4 py-2">
              {activeSeg.text}
            </div>
          );
        }

        if (template === 'bold-keyword') {
          const words = activeSeg.text.split(' ');
          return (
            <div style={{ ...baseStyle, textShadow: '0 3px 12px rgba(0,0,0,0.9)' }} class="font-black px-4 py-2 uppercase tracking-wide">
              {words.map((w, idx) => {
                const isKey = w.length > 4 || idx % 3 === 1;
                return (
                  <span key={idx} style={{ color: isKey ? s.highlightColor : s.color }}>
                    {w}{' '}
                  </span>
                );
              })}
            </div>
          );
        }

        if (template === 'karaoke-highlight') {
          if (activeSeg.words && activeSeg.words.length > 0) {
            return (
              <div style={{ ...baseStyle, textShadow: '0 2px 8px rgba(0,0,0,0.9)' }} class="font-bold px-4 py-2">
                {activeSeg.words.map((w, idx) => {
                  const isActive = videoCurrentTime >= w.start && videoCurrentTime <= w.end;
                  const isPast = videoCurrentTime > w.end;
                  return (
                    <span
                      key={idx}
                      class={`transition-all duration-150 inline-block mx-0.5 ${isActive ? 'scale-110 font-black animate-pulse-glow' : ''}`}
                      style={{
                        color: isActive ? s.highlightColor : isPast ? s.color : 'rgba(255,255,255,0.4)'
                      }}
                    >
                      {w.word}
                    </span>
                  );
                })}
              </div>
            );
          }
          return <div style={baseStyle}>{activeSeg.text}</div>;
        }

        if (template === 'word-pop') {
          if (activeSeg.words && activeSeg.words.length > 0) {
            return (
              <div style={{ ...baseStyle, textShadow: '0 3px 12px rgba(0,0,0,0.9)' }} class="font-extrabold px-4 py-2">
                {activeSeg.words.map((w, idx) => {
                  const isActive = videoCurrentTime >= w.start && videoCurrentTime <= w.end;
                  return (
                    <span
                      key={idx}
                      class={`inline-block mx-0.5 ${isActive ? 'animate-word-pop text-amber-400 font-black' : ''}`}
                      style={{ color: isActive ? s.highlightColor : s.color }}
                    >
                      {w.word}
                    </span>
                  );
                })}
              </div>
            );
          }
          return <div style={baseStyle}>{activeSeg.text}</div>;
        }

        if (template === 'documentary-serif') {
          return (
            <div
              style={{ ...baseStyle, fontFamily: 'Playfair Display, serif', color: '#FDF6E2', fontStyle: 'italic', textShadow: '0 2px 8px rgba(0,0,0,0.9)' }}
              class="px-6 py-2.5 border-b-2 border-amber-300/40"
            >
              "{activeSeg.text}"
            </div>
          );
        }

        if (template === 'news-lower-third') {
          return (
            <div class="w-full max-w-2xl mx-auto bg-slate-900/95 border-l-4 border-red-600 rounded-r shadow-2xl p-3 flex items-center space-x-3 text-left">
              <span class="bg-red-600 text-white text-[11px] font-black tracking-widest px-2 py-0.5 rounded uppercase">
                REPORT
              </span>
              <span style={{ fontFamily: s.fontFamily, color: '#FFFFFF', fontSize: '15px' }} class="font-bold flex-1">
                {activeSeg.text}
              </span>
            </div>
          );
        }

        if (template === 'typewriter') {
          const segDuration = activeSeg.end - activeSeg.start;
          const elapsed = Math.max(0, videoCurrentTime - activeSeg.start);
          const ratio = Math.min(1, elapsed / (segDuration || 1));
          const charCount = Math.floor(activeSeg.text.length * ratio);
          return (
            <div
              style={{ ...baseStyle, fontFamily: 'JetBrains Mono, monospace', color: '#34D399', backgroundColor: 'rgba(0,0,0,0.85)' }}
              class="inline-block px-4 py-1.5 rounded border border-emerald-500/50"
            >
              {activeSeg.text.slice(0, charCount)}<span class="animate-pulse">_</span>
            </div>
          );
        }

        if (template === 'clean-two-line') {
          return (
            <div
              style={{ ...baseStyle, maxWidth: '85%', textShadow: '0 2px 8px rgba(0,0,0,0.95)' }}
              class="mx-auto font-bold px-4 py-2 line-clamp-2"
            >
              {activeSeg.text}
            </div>
          );
        }

        if (template === 'boxed-caption') {
          return (
            <div
              style={{
                ...baseStyle,
                backgroundColor: `rgba(0, 0, 0, ${s.bgOpacity || 0.75})`,
                borderRadius: '10px'
              }}
              class="inline-block px-5 py-2.5 backdrop-blur-sm border border-white/10"
            >
              {activeSeg.text}
            </div>
          );
        }

        if (template === 'outline-caption') {
          return (
            <div
              style={{
                ...baseStyle,
                WebkitTextStroke: `${s.outlineWidth || 3}px ${s.outlineColor || '#000000'}`,
                color: s.color || '#FFFFFF',
                fontWeight: '900'
              }}
              class="px-4 py-2 uppercase tracking-wide"
            >
              {activeSeg.text}
            </div>
          );
        }

        if (template === 'highlight-bar') {
          return (
            <div class="inline-block px-4 py-1.5 rounded-lg font-bold" style={{ backgroundColor: s.highlightColor || '#FFD700', color: '#000000' }}>
              {activeSeg.text}
            </div>
          );
        }

        if (template === 'minimal-center') {
          return (
            <div
              style={{ ...baseStyle, backgroundColor: 'rgba(15, 23, 42, 0.75)' }}
              class="inline-block px-5 py-2 rounded-full border border-slate-700/60 font-semibold"
            >
              {activeSeg.text}
            </div>
          );
        }

        if (template === 'hinglish-caption') {
          return (
            <div
              style={{ ...baseStyle, fontFamily: 'Noto Sans Devanagari, Inter, sans-serif', textShadow: '0 2px 10px rgba(0,0,0,0.9)' }}
              class="font-bold px-4 py-2"
            >
              {activeSeg.text}
            </div>
          );
        }

        if (template === 'chapter-caption') {
          return (
            <div class="space-y-1 text-center">
              <div class="text-[11px] font-black uppercase tracking-widest text-indigo-400 bg-indigo-950/80 px-2 py-0.5 rounded inline-block border border-indigo-700/50">
                OVERVIEW
              </div>
              <div style={{ ...baseStyle, textShadow: '0 2px 8px rgba(0,0,0,0.9)' }} class="font-bold">
                {activeSeg.text}
              </div>
            </div>
          );
        }

        if (template === 'cinematic-editorial') {
          return (
            <div
              style={{ ...baseStyle, letterSpacing: '0.15em', textShadow: '0 3px 12px rgba(0,0,0,0.9)' }}
              class="font-semibold uppercase px-4 py-2"
            >
              {activeSeg.text}
            </div>
          );
        }

        return <div style={baseStyle}>{activeSeg.text}</div>;
      };

      return (
        <div class="flex h-screen bg-slate-950">
          {/* LEFT NAVIGATION SIDEBAR */}
          <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between">
            <div>
              <div class="p-5 border-b border-slate-800 flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                  AI
                </div>
                <div>
                  <h1 class="text-sm font-bold tracking-wide uppercase text-slate-100">Local Studio</h1>
                  <p class="text-xs text-indigo-400 font-medium">Production Platform</p>
                </div>
              </div>

              <nav class="p-3 space-y-1">
                {[
                  { id: 'documentary', label: 'Documentary Studio', badge: '8-Min AI Doc', icon: 'film' },
                  { id: 'enhancement', label: 'Video Quality & AI Pro', badge: '60 FPS ⚡', icon: 'zap' },
                  { id: 'clipper', label: 'AI Viral Clipper', badge: 'Viral 🔥', icon: 'scissors' },
                  { id: 'captions', label: 'Caption Studio', badge: 'Pro', icon: 'type' },
                  { id: 'new', label: 'New AI Video', icon: 'plus-circle' },
                  { id: 'progress', label: 'Job Pipeline', icon: 'activity' },
                  { id: 'editor', label: 'AI Video Editor', icon: 'sliders' },
                  { id: 'social', label: 'Social Studio', icon: 'share-2' },
                  { id: 'library', label: 'Project Library', icon: 'folder' },
                  { id: 'curated', label: 'Curated Topics', icon: 'compass' },
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setCurrentTab(item.id)}
                    class={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-sm font-medium transition ${
                      currentTab === item.id
                        ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30'
                        : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                    }`}
                  >
                    <span>{item.label}</span>
                    {item.badge && (
                      <span class="text-[10px] font-bold bg-indigo-500 text-white px-1.5 py-0.5 rounded">
                        {item.badge}
                      </span>
                    )}
                  </button>
                ))}
              </nav>
            </div>

            <div class="p-4 border-t border-slate-800 text-xs text-slate-500">
              <div class="flex items-center justify-between mb-1">
                <span>Hardware</span>
                <span class="text-emerald-400 font-semibold">GTX 1650 (Local)</span>
              </div>
              <div class="flex items-center justify-between">
                <span>Engines</span>
                <span class="text-slate-300">Whisper • FFmpeg • Remotion</span>
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main class="flex-1 flex flex-col overflow-hidden">
            {/* TOP HEADER */}
            <header class="h-14 border-b border-slate-800 bg-slate-900/50 backdrop-blur px-6 flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <h2 class="text-sm font-bold tracking-wide text-slate-200 uppercase">
                  {currentTab === 'documentary' ? 'Documentary Studio — Topic-to-Documentary AI Generator' : currentTab === 'enhancement' ? 'Video Quality & Cinematic Production Engine' : currentTab === 'clipper' ? 'AI Viral Clipper — YouTube & Podcast Auto-Shorts' : currentTab === 'captions' ? 'Caption Studio — Video & Animated Subtitles' : currentTab.toUpperCase()}
                </h2>
              </div>
              <div class="text-xs text-slate-400 flex items-center space-x-4">
                <span>Local Zero-Cost Pipeline</span>
                <span class="px-2 py-0.5 rounded bg-slate-800 text-indigo-400 font-mono">127.0.0.1:3000</span>
              </div>
            </header>

            {/* TAB CONTAINER */}
            <div class="flex-1 overflow-y-auto p-6 custom-scrollbar">

                            {/* ===================== TAB: DOCUMENTARY STUDIO ===================== */}
              {currentTab === 'documentary' && (
                <div class="max-w-7xl mx-auto space-y-6">

                  {/* Top Header & Project Switcher */}
                  <div class="flex flex-wrap items-center justify-between gap-4 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                    <div class="flex items-center space-x-4">
                      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-amber-500 flex items-center justify-center text-white text-lg font-black shadow-md shadow-indigo-600/30">
                        🎬
                      </div>
                      <div>
                        <h2 class="text-base font-extrabold text-slate-100 flex items-center space-x-2">
                          <span>Topic-to-Documentary Studio</span>
                          <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
                            8-Min Broadcast Engine
                          </span>

                      <button

                      <p class="text-xs text-slate-400">
                        Inspects master renders for black frames, frozen frames, audio-sync drift, and broadcast compliance.
                      </p>

                      <div class="space-y-3">
                        <button
                          onClick={handleRunQCInspection}
                          disabled={isInspectingQc}
                          class="w-full py-2.5 bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-bold text-xs rounded-xl transition shadow flex items-center justify-center space-x-2"
                        >
                          {isInspectingQc ? (
                            <span>🔬 Running FFprobe Diagnostic Inspection...</span>
                          ) : (
                            <span>🔍 Run QC Diagnostics On Active Video</span>
                          )}
                        </button>

                        {qcInspectionData ? (
                          <div class="bg-slate-950 border border-slate-800 rounded-xl p-3.5 space-y-3">
                            <div class="flex items-center justify-between">
                              <span class="text-xs font-bold text-slate-200">Overall Video Score</span>
                              <span class={`text-sm font-black px-2.5 py-0.5 rounded-full ${
                                qcInspectionData.overallScore >= 85 ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                              }`}>
                                {qcInspectionData.overallScore} / 100 ({qcInspectionData.passed ? 'PASSED' : 'NEEDS ATTENTION'})
                              </span>
                            </div>

                            <div class="grid grid-cols-2 gap-2 text-xs">
                              <div class="p-2 bg-slate-900 rounded-lg">
                                <div class="text-[10px] text-slate-400">Black Frames</div>
                                <div class="font-bold text-slate-100">{qcInspectionData.blackFramesDetected} Detected</div>
                              </div>
                              <div class="p-2 bg-slate-900 rounded-lg">
                                <div class="text-[10px] text-slate-400">Frozen Frames</div>
                                <div class="font-bold text-slate-100">{qcInspectionData.frozenFramesDetected} Detected</div>
                              </div>
                              <div class="p-2 bg-slate-900 rounded-lg">
                                <div class="text-[10px] text-slate-400">Bitrate</div>
                                <div class="font-bold text-slate-100 font-mono">{Math.round(qcInspectionData.bitrateKbps || 4500)} kbps</div>
                              </div>
                              <div class="p-2 bg-slate-900 rounded-lg">
                                <div class="text-[10px] text-slate-400">Audio Sync</div>
                                <div class="font-bold text-emerald-400">Locked (0ms drift)</div>
                              </div>
                            </div>
                          </div>
                        ) : (
                          <div class="p-4 bg-slate-950/60 border border-dashed border-slate-800 rounded-xl text-center text-xs text-slate-500">
                            Click above to run automated QC diagnostics on the currently active project render.
                          </div>
                        )}
                      </div>
                    </div>

                    {/* 5. COPYRIGHT & ASSET LICENSING MANAGEMENT (MODULE 9) */}
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                      <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
                        <span class="text-xs font-bold text-slate-200 uppercase flex items-center space-x-1.5">
                          <span>⚖️ Copyright & Asset Licensing Clearance</span>
                        </span>
                        <span class="text-[10px] font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">
                          YouTube Safe & Verified
                        </span>
                      </div>
                      <p class="text-xs text-slate-400">
                        Tracks, verifies, and records source licenses for every image, video, music track, and sound effect. Generates one-click copyable YouTube credits and compliance reports.
                      </p>

                      <div class="space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                          <button
                            onClick={handleRunCopyrightAudit}
                            disabled={isLoadingCopyright}
                            class="py-2.5 px-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-xs rounded-xl transition shadow flex items-center justify-center space-x-1.5"
                          >
                            <span>{isLoadingCopyright ? '⏳ Auditing Licenses...' : '🛡️ Audit Rights & Licensing'}</span>
                          </button>
                          <button
                            onClick={handleCopyAttribution}
                            disabled={!copyrightReport}
                            class={`py-2.5 px-3 font-bold text-xs rounded-xl transition shadow flex items-center justify-center space-x-1.5 border ${
                              copiedAttribution
                                ? 'bg-emerald-600 text-white border-emerald-500'
                                : copyrightReport
                                ? 'bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700'
                                : 'bg-slate-900 text-slate-600 border-slate-800 cursor-not-allowed'
                            }`}
                          >
                            <span>{copiedAttribution ? '✅ Copied to Clipboard!' : '📋 Copy YouTube Credits'}</span>
                          </button>
                        </div>

                        {copyrightReport ? (
                          <div class="bg-slate-950 border border-slate-800 rounded-xl p-3.5 space-y-3">
                            <div class="flex items-center justify-between">
                              <span class="text-xs font-bold text-slate-200">Licensing Clearance</span>
                              <span class={`text-xs font-black px-2.5 py-0.5 rounded-full ${
                                copyrightReport.summary.overallClearance === 'FULLY_CLEARED'
                                  ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                                  : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                              }`}>
                                {copyrightReport.summary.overallClearance.replace('_', ' ')} ({copyrightReport.summary.commercialClearedPercent}% Commercial)
                              </span>
                            </div>

                            <div class="grid grid-cols-4 gap-1.5 text-center text-xs">
                              <div class="p-1.5 bg-slate-900 rounded-lg">
                                <div class="text-[10px] text-slate-400">Total Assets</div>
                                <div class="font-bold text-slate-100">{copyrightReport.summary.totalAssets}</div>
                              </div>
                              <div class="p-1.5 bg-slate-900 rounded-lg">
                                <div class="text-[10px] text-slate-400">Visuals</div>
                                <div class="font-bold text-slate-100">
                                  {copyrightReport.assetBreakdown.images.length + copyrightReport.assetBreakdown.videos.length}
                                </div>
                              </div>
                              <div class="p-1.5 bg-slate-900 rounded-lg">
                                <div class="text-[10px] text-slate-400">Sound Effects</div>
                                <div class="font-bold text-slate-100">{copyrightReport.assetBreakdown.soundEffects.length} CC0</div>
                              </div>
                              <div class="p-1.5 bg-slate-900 rounded-lg">
                                <div class="text-[10px] text-slate-400">Soundtrack</div>
                                <div class="font-bold text-emerald-400">{copyrightReport.assetBreakdown.music.length} Cleared</div>
                              </div>
                            </div>

                            <button
                              onClick={() => setShowCopyrightModal(true)}
                              class="w-full py-1.5 bg-slate-800 hover:bg-slate-700 text-indigo-400 font-semibold text-xs rounded-lg transition border border-slate-700/60 flex items-center justify-center space-x-1"
                            >
                              <span>🔍 View Full Asset Registry Breakdown</span>
                            </button>

                            <div class="p-2.5 bg-amber-500/10 border border-amber-500/20 rounded-lg text-[11px] text-amber-300/90 leading-relaxed">
                              <span class="font-bold">⚠️ YouTube Content ID Advisory:</span> All background tracks and sound effects are royalty-free. Do not enroll your final composite video with automated YouTube Content ID networks as exclusive property.
                            </div>
                          </div>
                        ) : (
                          <div class="p-4 bg-slate-950/60 border border-dashed border-slate-800 rounded-xl text-center text-xs text-slate-500">
                            Click above to audit licensing and generate copy-paste YouTube attribution credits.
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* COPYRIGHT & ASSET REGISTRY MODAL */}
              {showCopyrightModal && copyrightReport && (
                <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                  <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-4xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                    <div class="flex items-center justify-between p-4 border-b border-slate-800 bg-slate-950">
                      <div class="flex items-center space-x-2">
                        <span class="text-base font-bold text-slate-100">⚖️ Copyright & Asset Registry Clearance Report</span>
                        <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-bold border border-emerald-500/30">
                          {copyrightReport.summary.overallClearance}
                        </span>
                      </div>
                      <button
                        onClick={() => setShowCopyrightModal(false)}
                        class="p-1 text-slate-400 hover:text-slate-100 hover:bg-slate-800 rounded-lg transition"
                      >
                        ✕
                      </button>
                    </div>

                    <div class="p-5 overflow-y-auto space-y-5 text-xs text-slate-300">
                      <div>
                        <h4 class="font-bold text-slate-100 mb-2 text-sm">Executive Clearance Summary</h4>
                        <div class="grid grid-cols-3 gap-3">
                          <div class="p-3 bg-slate-950 rounded-xl border border-slate-800">
                            <div class="text-slate-500 text-[11px]">Commercial Clearance Rate</div>
                            <div class="text-lg font-black text-emerald-400">{copyrightReport.summary.commercialClearedPercent}%</div>
                            <div class="text-[10px] text-slate-400">{copyrightReport.summary.commercialClearedCount} of {copyrightReport.summary.totalAssets} assets approved</div>
                          </div>
                          <div class="p-3 bg-slate-950 rounded-xl border border-slate-800">
                            <div class="text-slate-500 text-[11px]">Attribution Requirements</div>
                            <div class="text-lg font-black text-indigo-400">{copyrightReport.summary.attributionRequiredCount} Required</div>
                            <div class="text-[10px] text-slate-400">Included in description credits</div>
                          </div>
                          <div class="p-3 bg-slate-950 rounded-xl border border-slate-800">
                            <div class="text-slate-500 text-[11px]">Editorial / Fair Use Context</div>
                            <div class="text-lg font-black text-amber-400">{copyrightReport.summary.editorialReviewCount} Flagged</div>
                            <div class="text-[10px] text-slate-400">Documentary journalism safe</div>
                          </div>
                        </div>
                      </div>

                      <div>
                        <div class="flex items-center justify-between mb-2">
                          <h4 class="font-bold text-slate-100 text-sm">YouTube Description Credits (Copy & Paste)</h4>
                          <button
                            onClick={handleCopyAttribution}
                            class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition text-[11px]"
                          >
                            {copiedAttribution ? '✅ Copied!' : '📋 Copy Text'}
                          </button>
                        </div>
                        <pre class="p-3 bg-slate-950 border border-slate-800 rounded-xl text-[11px] font-mono text-slate-300 whitespace-pre-wrap max-h-48 overflow-y-auto">
                          {copyrightReport.youtubeDescriptionCredits}
                        </pre>
                      </div>

                      <div>
                        <h4 class="font-bold text-slate-100 mb-2 text-sm">Detailed Asset Inventory</h4>
                        <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
                          {[
                            ...copyrightReport.assetBreakdown.music,
                            ...copyrightReport.assetBreakdown.soundEffects,
                            ...copyrightReport.assetBreakdown.images,
                            ...copyrightReport.assetBreakdown.videos,
                            ...copyrightReport.assetBreakdown.narration
                          ].map((a, i) => (
                            <div key={i} class="p-2.5 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-between">
                              <div class="space-y-0.5">
                                <div class="flex items-center space-x-2">
                                  <span class="text-[10px] uppercase font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">
                                    {a.asset_type}
                                  </span>
                                  <span class="font-bold text-slate-200">{a.creator_name || 'Studio Asset'}</span>
                                  <span class="text-[11px] text-slate-400">({a.source_platform})</span>
                                </div>
                                <div class="text-[11px] text-slate-400">{a.attribution_text}</div>
                              </div>
                              <div class="text-right">
                                <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                  {a.license_type}
                                </span>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-1">
                        <div class="font-bold text-slate-300 text-[11px]">Legal & Content ID Advisory Notice</div>
                        <p class="text-[11px] text-slate-400 leading-relaxed">
                          {copyrightReport.legalAdvisoryNotice}
                        </p>
                      </div>
                    </div>

                    <div class="p-3 border-t border-slate-800 bg-slate-950 flex justify-end">
                      <button
                        onClick={() => setShowCopyrightModal(false)}
                        class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl transition"
                      >
                        Close
                      </button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
