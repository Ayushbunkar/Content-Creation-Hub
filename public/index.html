    // ==========================================
    // ==========================================
    // RETRO ARCADE FLAPPY BIRD (STUDIO EDITION)
    // Play while AI pipeline or render is running
    // ==========================================
    function FlappyBirdGame() {
      const canvasRef = React.useRef(null);
      const jumpRef = React.useRef(() => {});
      const [score, setScore] = React.useState(0);
      const [highScore, setHighScore] = React.useState(() => {
        try { return parseInt(localStorage.getItem('flappy_hs') || '0', 10); } catch (e) { return 0; }
      });
      const highScoreRef = React.useRef(highScore);
      highScoreRef.current = highScore;

      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const gravity = 0.14;
        const jumpPower = -3.8;
        const maxFallSpeed = 4.5;
        const gap = 170;
        const groundY = H - 36;
        const hitboxMargin = 7;

        let bird = { x: 60, y: H / 2 - 20, vy: 0, r: 12, rot: 0 };
        let pipes = [];
        let particles = [];
        let frame = 0;
        let localScore = 0;
        let state = 'idle'; // 'idle', 'playing', 'over'
        let deathTime = 0;
        let animId;

        const resetGame = () => {
          bird = { x: 60, y: H / 2 - 30, vy: jumpPower, r: 12, rot: -0.2 };
          pipes = [];
          particles = [];
          frame = 0;
          localScore = 0;
          setScore(0);
          state = 'playing';
        };

        const jumpBird = () => {
          const now = Date.now();
          if (state === 'idle') {
            resetGame();
          } else if (state === 'over') {
            // Prevent accidental instant restart within 250ms of dying
            if (now - deathTime > 250) {
              resetGame();
            }
          } else if (state === 'playing') {
            bird.vy = jumpPower;
            // Spawn little wind particles
            for (let i = 0; i < 3; i++) {
              particles.push({
                x: bird.x - 10,
                y: bird.y + (Math.random() * 8 - 4),
                vx: -1.5 - Math.random(),
                vy: Math.random() * 1.5 - 0.75,
                alpha: 0.8,
                color: '#fbbf24'
              });
            }
          }
        };

        jumpRef.current = jumpBird;

        const loop = () => {
          frame++;
          ctx.clearRect(0, 0, W, H);

          // 1. Retro Night Sky Gradient
          const grad = ctx.createLinearGradient(0, 0, 0, H);
          grad.addColorStop(0, '#0a0d17');
          grad.addColorStop(0.65, '#1e1b4b');
          grad.addColorStop(1, '#020617');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, W, H);

          // Starfield
          ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
          for (let s = 0; s < 22; s++) {
            const sx = ((s * 43) + (frame * 0.25)) % W;
            const sy = (s * 31) % (groundY - 30);
            ctx.fillRect(sx, sy, 1.5, 1.5);
          }

          // 2. Pipes & Collisions
          if (state === 'playing') {
            // First pipe spawns after frame 85, then every 95 frames
            if (frame > 85 && (frame - 85) % 95 === 0) {
              const minTop = 35;
              const maxTop = groundY - gap - 40;
              const topH = minTop + Math.random() * (maxTop - minTop);
              pipes.push({ x: W, top: topH, passed: false });
            }

            // Update bird physics
            bird.vy += gravity;
            if (bird.vy > maxFallSpeed) bird.vy = maxFallSpeed;
            bird.y += bird.vy;
            bird.rot = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.vy * 0.12));

            // Ceiling clamp (Do NOT kill on ceiling)
            if (bird.y - bird.r < 0) {
              bird.y = bird.r;
              bird.vy = 0;
            }

            // Ground collision
            if (bird.y + bird.r >= groundY) {
              bird.y = groundY - bird.r;
              state = 'over';
              deathTime = Date.now();
            }
          } else if (state === 'idle') {
            bird.y = H / 2 + Math.sin(frame * 0.08) * 8;
            bird.rot = 0;
          }

          // Render & check pipes
          for (let i = pipes.length - 1; i >= 0; i--) {
            const p = pipes[i];
            if (state === 'playing') {
              p.x -= 2.0;
            }

            const bottomY = p.top + gap;
            const bottomH = groundY - bottomY;

            // Score pass check
            if (state === 'playing' && !p.passed && p.x + 44 < bird.x) {
              p.passed = true;
              localScore++;
              setScore(localScore);
              const newHs = Math.max(highScoreRef.current, localScore);
              setHighScore(newHs);
              try { localStorage.setItem('flappy_hs', newHs.toString()); } catch (e) {}

              // Golden star burst on score
              for (let k = 0; k < 6; k++) {
                particles.push({
                  x: bird.x,
                  y: bird.y,
                  vx: (Math.random() - 0.5) * 4,
                  vy: (Math.random() - 0.5) * 4,
                  alpha: 1.0,
                  color: '#facc15'
                });
              }
            }

            // Draw Pipes (Retro arcade green with highlight & rim)
            // Top pipe
            ctx.fillStyle = '#15803d';
            ctx.fillRect(p.x, 0, 44, p.top);
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(p.x + 3, 0, 5, p.top);
            ctx.fillStyle = '#166534';
            ctx.fillRect(p.x - 3, p.top - 18, 50, 18);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(p.x - 1, p.top - 16, 5, 14);

            // Bottom pipe
            ctx.fillStyle = '#15803d';
            ctx.fillRect(p.x, bottomY, 44, bottomH);
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(p.x + 3, bottomY, 5, bottomH);
            ctx.fillStyle = '#166534';
            ctx.fillRect(p.x - 3, bottomY, 50, 18);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(p.x - 1, bottomY + 2, 5, 14);

            // Forgiving hitbox collision check
            if (state === 'playing') {
              const birdRight = bird.x + bird.r - hitboxMargin;
              const birdLeft = bird.x - bird.r + hitboxMargin;
              const pipeRight = p.x + 44;
              const pipeLeft = p.x;

              if (birdRight > pipeLeft && birdLeft < pipeRight) {
                const birdTop = bird.y - bird.r + hitboxMargin;
                const birdBottom = bird.y + bird.r - hitboxMargin;

                if (birdTop < p.top || birdBottom > bottomY) {
                  state = 'over';
                  deathTime = Date.now();
                }
              }
            }

            if (p.x < -60) pipes.splice(i, 1);
          }

          // 3. Ground (Animated scrolling pattern)
          ctx.fillStyle = '#064e3b';
          ctx.fillRect(0, groundY, W, 36);
          ctx.fillStyle = '#10b981';
          ctx.fillRect(0, groundY, W, 4);

          // Moving grass stripes
          ctx.fillStyle = '#047857';
          const grassOffset = state === 'playing' ? (frame * 2.0) % 18 : 0;
          for (let gx = -grassOffset; gx < W + 18; gx += 18) {
            ctx.fillRect(gx, groundY + 4, 9, 32);
          }

          // 4. Particles (Jump air & score bursts)
          for (let pi = particles.length - 1; pi >= 0; pi--) {
            const pt = particles[pi];
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.alpha -= 0.035;
            if (pt.alpha <= 0) {
              particles.splice(pi, 1);
              continue;
            }
            ctx.save();
            ctx.globalAlpha = Math.max(0, pt.alpha);
            ctx.fillStyle = pt.color;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // 5. Draw Flappy Bird
          ctx.save();
          ctx.translate(bird.x, bird.y);
          ctx.rotate(bird.rot);

          // Body (Vibrant Golden Yellow)
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#0f172a';
          ctx.stroke();

          // Wing (Flapping animation)
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          const wingFlap = state === 'playing' && bird.vy < 0 ? -4 : Math.sin(frame * 0.28) * 3;
          ctx.ellipse(-4, wingFlap, 6, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Eye & Pupil
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(4, -4, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(5.5, -4, 2, 0, Math.PI * 2);
          ctx.fill();

          // Beak
          ctx.fillStyle = '#ea580c';
          ctx.beginPath();
          ctx.moveTo(8, -2);
          ctx.lineTo(16, 1.5);
          ctx.lineTo(8, 5);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.restore();

          // 6. HUD / Overlay State
          if (state === 'playing') {
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 32px monospace';
            ctx.textAlign = 'center';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;
            ctx.strokeText(localScore.toString(), W / 2, 48);
            ctx.fillText(localScore.toString(), W / 2, 48);
          } else if (state === 'idle') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(0, 0, W, H);

            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 22px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('FLAPPY BIRD', W / 2, H / 2 - 45);

            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 13px sans-serif';
            ctx.fillText('Tap Screen or Press SPACE to Start', W / 2, H / 2 + 35);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '11px sans-serif';
            ctx.fillText('Timepass while your video processes!', W / 2, H / 2 + 58);
          } else if (state === 'over') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
            ctx.fillRect(0, 0, W, H);

            ctx.fillStyle = '#f43f5e';
            ctx.font = 'bold 26px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', W / 2, H / 2 - 42);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText(`Score: ${localScore}`, W / 2, H / 2 - 8);

            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 13px sans-serif';
            ctx.fillText(`Best: ${Math.max(highScoreRef.current, localScore)}`, W / 2, H / 2 + 16);

            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 13px sans-serif';
            ctx.fillText('Tap or Press SPACE to Play Again', W / 2, H / 2 + 55);
          }

          animId = requestAnimationFrame(loop);
        };

        animId = requestAnimationFrame(loop);

        const onKeyDown = (e) => {
          if (['INPUT', 'TEXTAREA'].includes(e.target?.tagName)) return;
          if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
            jumpBird();
          }
        };
        window.addEventListener('keydown', onKeyDown);

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('keydown', onKeyDown);
        };
      }, []);

      return (
        <div class="flex flex-col items-center justify-center p-5 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl space-y-3 select-none">
          <div class="flex items-center justify-between w-full max-w-[340px] px-1">
            <div class="flex items-center space-x-2">
              <span class="text-base">🎮</span>
              <span class="text-xs font-bold uppercase tracking-wider text-amber-400">Flappy Timepass Mini-Game</span>
            </div>
            <div class="text-[11px] font-mono text-slate-400">
              Score: <strong class="text-white">{score}</strong> | Best: <strong class="text-amber-300">{highScore}</strong>
            </div>
          </div>

          <div
            onPointerDown={(e) => {
              e.preventDefault();
              jumpRef.current();
            }}
            class="relative rounded-xl overflow-hidden border-2 border-indigo-900/60 shadow-2xl cursor-pointer hover:border-indigo-500 transition active:scale-[0.99]"
          >
            <canvas
              ref={canvasRef}
              width={340}
              height={360}
              class="block"
            />
          </div>

          <p class="text-[11px] text-slate-400 text-center">
            Tap on screen or press <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono text-[10px]">SPACE</kbd> or <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono text-[10px]">↑</kbd> to flap & dodge pipes!
          </p>
        </div>
      );
    }

    // ==========================================
    // SYNCHRONIZED CLIPPER LIVE STUDIO PLAYER
    // Live dual-layer blurred backdrop simulation + burned animated caption overlay
    // ==========================================
    function sanitizeClipperText(text) {
      if (!text) return '';
      return String(text)
        .replace(/&gt;/gi, '')
        .replace(/&lt;/gi, '')
        .replace(/&amp;/gi, '&')
        .replace(/&quot;/gi, '"')
        .replace(/&#39;/gi, "'")
        .replace(/&apos;/gi, "'")
        .replace(/&nbsp;/gi, ' ')
        .replace(/&[a-z0-9#]+;/gi, ' ')
        .replace(/^(\s*>+\s*)+/g, '')
        .replace(/(\s*>+\s*)+/g, ' ')
        .replace(/^(\s*<+\s*)+/g, '')
        .replace(/(\s*<+\s*)+/g, ' ')
        .replace(/\[[^\]]*(?:music|applause|laughter|cheering|sound|silence|audio|screaming)[^\]]*\]/gi, '')
        .replace(/\([^)]*(?:music|applause|laughter|cheering|sound|silence|audio|screaming)[^)]*\)/gi, '')
        .replace(/\[(?:music|applause|laughter|cheering|sound|silence|audio|screaming)[^\]]*/gi, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function ClipperLivePlayer({ clip, project, onUpdate, onOpenConcat }) {
      const fgRef = React.useRef(null);
      const bgRef = React.useRef(null);
      const camRef = React.useRef(null);
      const containerRef = React.useRef(null);
      const [isPlaying, setIsPlaying] = React.useState(false);
      const [currentTime, setCurrentTime] = React.useState(0);
      const [activeSubtitle, setActiveSubtitle] = React.useState('');
      const [isMuted, setIsMuted] = React.useState(false);
      const [isAligning, setIsAligning] = React.useState(false);
      const [isDraggingCaption, setIsDraggingCaption] = React.useState(false);
      const [dragYPercent, setDragYPercent] = React.useState(null);

      // Interactive mouse/touch drag handler for freeform caption positioning
      const handleCaptionPointerDown = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDraggingCaption(true);
        const container = containerRef.current;
        if (!container) return;
        const rect = container.getBoundingClientRect();

        const updatePos = (moveEvent) => {
          const clientY = (moveEvent.touches && moveEvent.touches.length > 0)
            ? moveEvent.touches[0].clientY
            : moveEvent.clientY;
          if (clientY === undefined) return null;
          const relY = clientY - rect.top;
          const clampedPercent = Math.max(8, Math.min(92, Math.round((relY / rect.height) * 100)));
          setDragYPercent(clampedPercent);
          return clampedPercent;
        };

        const onMove = (moveEvt) => {
          updatePos(moveEvt);
        };

        const onUp = (upEvt) => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          window.removeEventListener('touchmove', onMove);
          window.removeEventListener('touchend', onUp);
          setIsDraggingCaption(false);

          const finalY = updatePos(upEvt);
          setDragYPercent(null);
          if (typeof finalY === 'number' && onUpdate) {
            const verticalOffset = Math.round(1920 * (1 - finalY / 100));
            onUpdate({
              custom_style: {
                ...(clip.custom_style || {}),
                posY: finalY,
                verticalOffset: verticalOffset,
                position: 'custom'
              }
            });
          }
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onUp);
      };

      const hasExported = !!clip.exported_video;
      // Default to 'live' edit mode so all user changes (font, color, zoom) appear instantly!
      const [playerMode, setPlayerMode] = React.useState('live');
      const isRendered = playerMode === 'rendered' && hasExported;
      const reframingMode = clip.reframing_mode || 'blur_background';
      const aspectRatio = clip.aspect_ratio || '9:16';

      // Auto-switch to live edit mode whenever any style, preset, framing, or zoom option is clicked
      React.useEffect(() => {
        setPlayerMode('live');
      }, [
        clip.caption_template,
        clip.aspect_ratio,
        clip.reframing_mode,
        clip.start_time,
        clip.end_time,
        JSON.stringify(clip.custom_style)
      ]);

      // Duration & time window
      const clipStart = clip.start_time || 0;
      const clipEnd = clip.end_time || (clipStart + (clip.duration || 30));
      const clipDuration = Math.max(1, clipEnd - clipStart);

      // Synchronize all active video layers (gameplay, bottom split, and facecam)
      React.useEffect(() => {
        setIsPlaying(false);
        setCurrentTime(0);
        setActiveSubtitle('');
        const targetTime = (!isRendered && clipStart > 0) ? clipStart : 0;
        if (fgRef.current) fgRef.current.currentTime = targetTime;
        if (bgRef.current) bgRef.current.currentTime = targetTime;
        if (camRef.current) camRef.current.currentTime = targetTime;
      }, [clip.id, isRendered, clipStart, reframingMode]);

      // Unified Play / Pause for all active split layers
      const playAllLayers = () => {
        if (fgRef.current && fgRef.current.paused) fgRef.current.play().catch(() => {});
        if (bgRef.current && bgRef.current.paused) bgRef.current.play().catch(() => {});
        if (camRef.current && camRef.current.paused) camRef.current.play().catch(() => {});
        setIsPlaying(true);
      };

      const pauseAllLayers = () => {
        if (fgRef.current && !fgRef.current.paused) fgRef.current.pause();
        if (bgRef.current && !bgRef.current.paused) bgRef.current.pause();
        if (camRef.current && !camRef.current.paused) camRef.current.pause();
        setIsPlaying(false);
      };

      const togglePlay = () => {
        if (!fgRef.current) return;
        if (fgRef.current.paused) {
          playAllLayers();
        } else {
          pauseAllLayers();
        }
      };

      const handleTimeUpdate = () => {
        if (!fgRef.current) return;
        const cur = fgRef.current.currentTime;

        if (isRendered) {
          setCurrentTime(cur);
          if (fgRef.current.ended) {
            setIsPlaying(false);
          }
        } else {
          // Check loop boundary
          if (cur >= clipEnd || cur < clipStart - 0.5) {
            fgRef.current.currentTime = clipStart;
            if (bgRef.current) bgRef.current.currentTime = clipStart;
            if (camRef.current) camRef.current.currentTime = clipStart;
            setCurrentTime(0);
            return;
          }
          const relTime = cur - clipStart;
          setCurrentTime(relTime);

          // Real-time lockstep frame synchronization for ALL split & backdrop layers (< 0.08s drift)
          if (bgRef.current) {
            if (Math.abs(bgRef.current.currentTime - cur) > 0.08) {
              bgRef.current.currentTime = cur;
            }
            if (!fgRef.current.paused && bgRef.current.paused) {
              bgRef.current.play().catch(() => {});
            } else if (fgRef.current.paused && !bgRef.current.paused) {
              bgRef.current.pause();
            }
          }
          if (camRef.current) {
            if (Math.abs(camRef.current.currentTime - cur) > 0.08) {
              camRef.current.currentTime = cur;
            }
            if (!fgRef.current.paused && camRef.current.paused) {
              camRef.current.play().catch(() => {});
            } else if (fgRef.current.paused && !camRef.current.paused) {
              camRef.current.pause();
            }
          }

          // Compute active subtitle from transcript_segments
          let segs = clip.transcript_segments;
          if (typeof segs === 'string') {
            try { segs = JSON.parse(segs); } catch (e) { segs = []; }
          }
          if (Array.isArray(segs) && segs.length > 0) {
            const seg = segs.find(s => cur >= s.start && cur <= s.end);
            if (seg) {
              setActiveSubtitle(sanitizeClipperText(seg.text));
            } else {
              setActiveSubtitle('');
            }
          }
        }
      };

      const handleSeek = (e) => {
        const val = parseFloat(e.target.value);
        setCurrentTime(val);
        if (fgRef.current) {
          if (isRendered) {
            fgRef.current.currentTime = val;
          } else {
            const targetT = clipStart + val;
            fgRef.current.currentTime = targetT;
            if (bgRef.current) bgRef.current.currentTime = targetT;
            if (camRef.current) camRef.current.currentTime = targetT;
          }
        }
      };

      // Aspect container class
      const containerAspect = aspectRatio === '16:9'
        ? 'aspect-video max-w-[540px]'
        : aspectRatio === '1:1'
        ? 'aspect-square max-w-[420px]'
        : 'aspect-[9/16] max-h-[480px] w-full max-w-[300px]';

      return (
        <div class="space-y-3">
          <div ref={containerRef} class={`${containerAspect} mx-auto bg-slate-950 rounded-2xl overflow-hidden border-2 border-indigo-500/40 relative shadow-2xl flex items-center justify-center select-none group`}>
            {isRendered ? (
              // RENDERED FINAL VIDEO
              <video
                ref={fgRef}
                src={`/${clip.exported_video}`}
                onTimeUpdate={handleTimeUpdate}
                onPlay={() => setIsPlaying(true)}
                onPause={() => setIsPlaying(false)}
                muted={isMuted}
                playsInline
                class="w-full h-full object-cover"
              />
            ) : project?.video_path ? (
              // DYNAMIC REAL-TIME BROWSER SIMULATION
              <div class="w-full h-full relative overflow-hidden flex items-center justify-center">
                {/* 1. Blurred Backdrop Layer (if blur_background) */}
                {reframingMode === 'blur_background' && (
                  <video
                    ref={bgRef}
                    src={`/${project.video_path}`}
                    preload="auto"
                    muted
                    playsInline
                    onLoadedMetadata={(e) => {
                      if (!isRendered && clipStart > 0) e.target.currentTime = clipStart;
                    }}
                    class="absolute inset-0 w-full h-full object-cover filter blur-2xl scale-125 opacity-75 brightness-75 pointer-events-none"
                  />
                )}

                {/* 2. Primary Foreground Layer: Handles Full, Center Crop, or Split Layouts */}
                {reframingMode === 'split_facecam' ? (
                  // Gaming Facecam Stack: 58% Gameplay on top, 42% Cam on bottom (100% time synchronized)
                  <div class="w-full h-full flex flex-col relative z-10">
                    <div class="h-[58%] w-full overflow-hidden relative border-b-2 border-indigo-500/50">
                      <video
                        ref={fgRef}
                        src={`/${project.video_path}`}
                        preload="auto"
                        onLoadedMetadata={(e) => {
                          if (!isRendered && clipStart > 0) e.target.currentTime = clipStart;
                        }}
                        onTimeUpdate={handleTimeUpdate}
                        onPlay={playAllLayers}
                        onPause={pauseAllLayers}
                        muted={isMuted}
                        playsInline
                        class="w-full h-full object-cover scale-110"
                      />
                      <span class="absolute bottom-1 right-2 px-1.5 py-0.5 rounded text-[8px] font-bold bg-black/70 text-indigo-300 uppercase pointer-events-none">Gameplay</span>
                    </div>
                    <div class="h-[42%] w-full overflow-hidden relative bg-slate-950 flex items-center justify-center">
                      <video
                        ref={bgRef}
                        src={`/${project.video_path}`}
                        preload="auto"
                        muted
                        playsInline
                        onLoadedMetadata={(e) => {
                          if (!isRendered && clipStart > 0) e.target.currentTime = clipStart;
                        }}
                        class="absolute inset-0 w-full h-full object-cover filter blur-xl opacity-60 scale-125 pointer-events-none"
                      />
                      <video
                        ref={camRef}
                        src={`/${project.video_path}`}
                        preload="auto"
                        muted
                        playsInline
                        onLoadedMetadata={(e) => {
                          if (!isRendered && clipStart > 0) e.target.currentTime = clipStart;
                        }}

                      />
                      <span class="absolute bottom-1 right-2 px-1.5 py-0.5 rounded text-[8px] font-bold bg-black/70 text-cyan-300 uppercase pointer-events-none z-20">Cam</span>
                    </div>
                  </div>
                ) : reframingMode === 'split_screen' ? (
                  // Two-Person Podcast Stack: 50% Top Speaker, 50% Bottom Speaker (100% time synchronized)
                  <div class="w-full h-full flex flex-col relative z-10">
                    <div class="h-1/2 w-full overflow-hidden relative border-b border-indigo-500/40">
                      <video
                        ref={fgRef}
                        src={`/${project.video_path}`}
                        preload="auto"
                        onLoadedMetadata={(e) => {
                          if (!isRendered && clipStart > 0) e.target.currentTime = clipStart;
                        }}
                        onTimeUpdate={handleTimeUpdate}
                        onPlay={playAllLayers}
                        onPause={pauseAllLayers}
                        muted={isMuted}
                        playsInline
                        class="w-full h-full object-cover origin-left scale-125"
                      />
                      <span class="absolute top-1 right-2 px-1.5 py-0.5 rounded text-[8px] font-bold bg-black/70 text-purple-300 uppercase pointer-events-none">Top Speaker</span>
                    </div>
                    <div class="h-1/2 w-full overflow-hidden relative">
                      <video
                        ref={bgRef}
                        src={`/${project.video_path}`}
                        preload="auto"
                        onLoadedMetadata={(e) => {
                          if (!isRendered && clipStart > 0) e.target.currentTime = clipStart;
                        }}
                        muted
                        playsInline
                        class="w-full h-full object-cover origin-right scale-125"
                      />
                      <span class="absolute bottom-1 right-2 px-1.5 py-0.5 rounded text-[8px] font-bold bg-black/70 text-pink-300 uppercase pointer-events-none">Bottom Speaker</span>
                    </div>
                  </div>
                ) : (
                  <video
                    ref={fgRef}
                    src={`/${project.video_path}`}
                    preload="auto"
                    onLoadedMetadata={(e) => {
                      if (!isRendered && clipStart > 0) e.target.currentTime = clipStart;
                    }}
                    onTimeUpdate={handleTimeUpdate}
                    onPlay={playAllLayers}
                    onPause={pauseAllLayers}
                    muted={isMuted}
                    playsInline
                    style={{
                      transform: (!isRendered && (clip.custom_style || {}).cameraPreset !== 'static_professional_frame')
                        ? `scale(${parseFloat((clip.custom_style || {}).zoomIntensity || 1.15)})`
                        : 'scale(1)',
                      transition: isPlaying ? 'transform 3s cubic-bezier(0.25, 1, 0.5, 1)' : 'transform 0.3s ease-out'
                    }}
                    class={`relative z-10 transition-transform origin-[50%_36%] ${
                      reframingMode === 'center_crop'
                        ? 'w-full h-full object-cover'

                    }`}
                  />
                )}

                {/* 3. Viral Hook Title Card (First 3.8s) */}
                {clip.hook && (clip.custom_style || {}).showHookTitle !== false && currentTime <= 3.8 && (
                  <div class="absolute top-10 left-1/2 -translate-x-1/2 w-[88%] z-30 flex justify-center text-center pointer-events-none transition-all">
                    <div class="px-3 py-1 rounded-xl bg-black/90 border border-yellow-400/90 shadow-2xl backdrop-blur-md max-w-full animate-pulse">
                      <span class="text-[11px] font-black uppercase tracking-wider text-yellow-300 flex items-center justify-center gap-1.5 break-words">
                        🔥 {sanitizeClipperText(clip.hook)}
                      </span>
                    </div>
                  </div>
                )}

                {/* 4. Live Interactive Animated Caption Overlay with Proportional Size & Hand Drag */}
                {(() => {
                  const cs = clip.custom_style || {};
                  const currentTmplId = clip.caption_template || 'minimal-montserrat';
                  const tmpl = CAPTION_TEMPLATES.find(t => t.id === currentTmplId) || CAPTION_TEMPLATES[0];

                  const fontFam = cs.fontFamily || tmpl.font || 'Montserrat';
                  const textCol = cs.color || tmpl.preview.text || '#FFFFFF';
                  const highlightCol = cs.highlightColor || tmpl.preview.accent || '#FFE600';
                  const highlightMode = cs.highlightMode || 'word-by-word';

                  // Dynamic proportional font scaling: directly scales with slider (36px -> ~8px, 68px -> ~15px, 110px -> ~24.5px)
                  const rawFont = (typeof cs.fontSize === 'number' && cs.fontSize > 0) ? cs.fontSize : 68;
                  const basePreviewFont = 15;
                  const fontSize = Math.max(8, Math.min(28, Math.round((rawFont / 68) * basePreviewFont * 10) / 10));

                  // Y Position calculation: supports freeform drag percentage, cs.posY, or safe buttons
                  let currentY = 84;
                  if (dragYPercent !== null) {
                    currentY = dragYPercent;
                  } else if (typeof cs.posY === 'number') {
                    currentY = cs.posY;
                  } else if (cs.position === 'top') {
                    currentY = 12;
                  } else if (cs.position === 'center' || reframingMode === 'split_facecam') {
                    currentY = 50;
                  } else if (cs.position === 'lower-third') {
                    currentY = 72;
                  } else if (cs.verticalOffset !== undefined) {
                    currentY = Math.max(8, Math.min(92, Math.round((1 - cs.verticalOffset / 1920) * 100)));
                  }

                  // Determine subtitle text: if active subtitle exists use it; if paused or dragging, show sample/first segment so user can see live styling
                  let segs = clip.transcript_segments;
                  if (typeof segs === 'string') {
                    try { segs = JSON.parse(segs); } catch (e) { segs = []; }
                  }
                  let subtitleToRender = activeSubtitle;
                  if (!subtitleToRender && (!isPlaying || isDraggingCaption)) {
                    if (Array.isArray(segs) && segs.length > 0) {
                      const curSeg = segs.find(s => currentTime >= s.start && currentTime <= s.end);
                      subtitleToRender = curSeg ? sanitizeClipperText(curSeg.text) : sanitizeClipperText(segs[0].text);
                    } else if (clip.hook) {
                      subtitleToRender = sanitizeClipperText(clip.hook);
                    } else {
                      subtitleToRender = 'AI Viral Caption';
                    }
                  }

                  if (!subtitleToRender) return null;

                  const words = subtitleToRender.split(' ').filter(Boolean);

                  // Template-accurate styles
                  let badgeBg = 'rgba(0,0,0,0.76)';
                  if (['boxed-caption','netflix-doc','news-broadcast','cinematic-two-line','centered-impact'].includes(currentTmplId)) {
                    badgeBg = 'rgba(0,0,0,0.88)';
                  } else if (currentTmplId === 'yellow-box-highlight') {
                    badgeBg = '#FFD700';
                  } else if (currentTmplId === 'magazine-paper') {
                    badgeBg = '#F5F0E8';
                  } else if (currentTmplId === 'typewriter') {
                    badgeBg = '#022c22';
                  } else if (currentTmplId === 'news-lower-third') {
                    badgeBg = '#001B6B';
                  } else if (['minimal-light','clean-subtitle','outline-caption'].includes(currentTmplId)) {
                    badgeBg = 'transparent';
                  }

                  let textShadow = '1px 1px 3px rgba(0,0,0,0.95)';
                  if (tmpl.preview.glow || currentTmplId === 'neon-captions' || currentTmplId === 'neon-glow') {
                    textShadow = `0 0 10px ${textCol}, 0 0 20px ${textCol}`;
                  }

                  let textStroke = undefined;
                  if (currentTmplId === 'outline-caption' || currentTmplId === 'gaming-captions') {
                    textStroke = '0.9px black';
                  }

                  let textTransform = 'none';
                  if (['hormozi-bold', 'mrbeast-bold', 'gaming-captions', 'centered-impact'].includes(currentTmplId) || (tmpl.preview.style && tmpl.preview.style.includes('uppercase'))) {
                    textTransform = 'uppercase';
                  }

                  let fontWeight = '800';
                  if (currentTmplId === 'minimal-light' || (tmpl.preview.style && tmpl.preview.style.includes('font-light'))) {
                    fontWeight = '400';
                  } else if (['hormozi-bold', 'mrbeast-bold', 'viral-word-pop'].includes(currentTmplId)) {
                    fontWeight = '900';
                  }

                  let letterSpacing = 'normal';
                  if (currentTmplId === 'netflix-doc') {
                    letterSpacing = '0.08em';
                  } else if (['hormozi-bold', 'centered-impact'].includes(currentTmplId)) {
                    letterSpacing = '-0.02em';
                  }

                  return (
                    <div
                      onMouseDown={handleCaptionPointerDown}
                      onTouchStart={handleCaptionPointerDown}
                      class={`absolute left-1/2 -translate-x-1/2 -translate-y-1/2 w-[88%] z-30 flex flex-col items-center justify-center text-center cursor-grab active:cursor-grabbing select-none group/caption ${
                        isDraggingCaption ? 'ring-2 ring-indigo-400 ring-offset-2 ring-offset-black/70 rounded-2xl scale-105' : ''
                      }`}
                      style={{
                        top: `${currentY}%`,
                        touchAction: 'none'
                      }}
                      title="Click & drag to position caption anywhere with your hand"
                    >
                      {/* Drag position indicator & hint tooltip */}
                      <div class={`mb-1 px-2 py-0.5 rounded-full text-[9px] font-black uppercase tracking-wider transition-opacity pointer-events-none ${
                        isDraggingCaption
                          ? 'opacity-100 bg-indigo-600 text-white shadow-lg'
                          : 'opacity-0 group-hover/caption:opacity-100 bg-black/85 text-indigo-300 border border-indigo-500/50'
                      }`}>
                        <span>✋ {isDraggingCaption ? `Position: ${currentY}%` : 'Drag to Move'}</span>
                      </div>

                      <span
                        class="inline-block max-w-full px-3 py-1.5 rounded-xl shadow-2xl backdrop-blur-md break-words whitespace-normal leading-snug transition-all"
                        style={{
                          backgroundColor: badgeBg,
                          color: textCol,
                          fontSize: `${fontSize}px`,
                          fontFamily: `${fontFam}, sans-serif`,
                          fontWeight: fontWeight,
                          textTransform: textTransform,
                          letterSpacing: letterSpacing,
                          textShadow: textShadow,
                          WebkitTextStroke: textStroke,
                          border: isDraggingCaption ? '2px dashed #818cf8' : (badgeBg === 'transparent' ? 'none' : '1px solid rgba(255,255,255,0.20)'),
                          boxSizing: 'border-box',
                          wordBreak: 'break-word',
                          overflowWrap: 'break-word',
                          lineHeight: '1.3',
                          textAlign: 'center',
                          maxWidth: '100%'
                        }}
                      >
                        {currentTmplId === 'news-broadcast' && <span style={{color: '#FF0000', fontWeight: '900', marginRight: '4px'}}>⬤</span>}
                        {words.map((w, i) => {
                          let isHighlighted = false;
                          if (highlightMode === 'no-highlighting') {
                            isHighlighted = false;
                          } else if (highlightMode === 'entire-sentence') {
                            isHighlighted = true;
                          } else if (highlightMode === 'word-by-word') {
                            if (isPlaying) {
                              const wordIndex = Math.min(words.length - 1, Math.floor(((currentTime % 2) / 2) * words.length));
                              isHighlighted = (i === wordIndex);
                            } else {
                              isHighlighted = (i === 1 || i === Math.floor(words.length / 2));
                            }
                          } else {
                            // keyword-emphasis
                            isHighlighted = (i === 1 || i === words.length - 1);
                          }

                          const wordColor = isHighlighted
                            ? (currentTmplId === 'yellow-box-highlight' ? '#000000' : highlightCol)
                            : (currentTmplId === 'yellow-box-highlight' ? '#111827' : textCol);

                          const wordBg = (currentTmplId === 'yellow-box-highlight' && isHighlighted)
                            ? '#FFFFFF'
                            : undefined;

                          return (
                            <span
                              key={i}
                              style={{
                                color: wordColor,
                                backgroundColor: wordBg,
                                padding: wordBg ? '1px 5px' : undefined,
                                borderRadius: wordBg ? '4px' : undefined,
                                display: 'inline',
                                textShadow: isHighlighted && (currentTmplId === 'neon-glow' || currentTmplId === 'neon-captions') ? `0 0 12px ${highlightCol}` : undefined
                              }}
                            >
                              {w}{i < words.length - 1 ? ' ' : ''}
                            </span>
                          );
                        })}
                      </span>
                    </div>
                  );
                })()}

                {/* 5. Live Reframing & Smart Camera Badge */}
                <div class="absolute top-3 left-3 z-20 flex flex-col space-y-1">

                    {reframingMode === 'split_facecam' ? '🎮 Gaming Facecam Split' : reframingMode === 'split_screen' ? '👥 Podcast 50/50 Split' : reframingMode === 'center_crop' ? '🎯 Center Crop' : '🎬 Live Blurred Backdrop'}

                  {(clip.custom_style || {}).cameraPreset && (clip.custom_style || {}).cameraPreset !== 'static_professional_frame' && (

            {/* Hover Play/Pause Overlay Button */}

          {/* Interactive Player Transport Controls */}
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 flex flex-col space-y-2">

              <button

              <input

              />

              <span class="text-[11px] font-mono text-slate-400 shrink-0">

              </span>
            </div>

            <div class="flex items-center justify-between text-[11px] text-slate-400 pt-1 border-t border-slate-900">
              <div class="flex items-center space-x-2">
                {hasExported ? (
                  <div class="flex bg-slate-900 p-0.5 rounded-lg border border-slate-800">

                  </div>
                ) : (
                  <span class="flex items-center space-x-1.5 text-indigo-400 font-bold">

                  </span>
                )}
              </div>

              <div class="flex items-center space-x-2">
                <button
                  onClick={async () => {
                    setIsAligning(true);
                    try {
                      const res = await fetch(`/api/clipper/clips/${clip.id}/align-whisper`, { method: 'POST' });
                      const data = await res.json();
                      if (data.success && onUpdate) {
                        onUpdate(data.clip);
                      }
                    } catch (e) {
                      console.error('Whisper sync error:', e);

                      setIsAligning(false);
                    }
                  }}
                  disabled={isAligning}
                  class="px-2.5 py-1 bg-violet-600 hover:bg-violet-500 text-white rounded text-[10px] font-bold flex items-center space-x-1 shadow-sm transition disabled:opacity-50"

                  <span>{isAligning ? '⏳ Syncing...' : '🎙️ Sync Audio & Captions'}</span>
                </button>
                {onOpenConcat && (
                  <button
                    onClick={() => onOpenConcat({ videoPath: clip.exported_video || project?.video_path, clipId: clip.id, projectId: project?.id })}
                    class="px-2.5 py-1 bg-amber-600/90 hover:bg-amber-500 text-white rounded text-[10px] font-bold flex items-center space-x-1 shadow-sm transition"

                )}
                <span class="text-indigo-400 font-bold">{aspectRatio} • {reframingMode}</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

            suggestedTagsString: '#shorts #viral #trending #gaming #reels',
            alternativeTitles: []
          },
          isPublishing: false,
          publishResults: null
        });

        // Check if clip was previously published across any platform
        try {
          const statusRes = await fetch(`/api/social/clip-status/${targetClipId}`);
          const statusData = await statusRes.json();
          if (statusData.publications && statusData.publications.length > 0) {
            const pubMap = {};
            statusData.publications.forEach(p => {
              if (p.status === 'published' && p.publishedUrl) {
                pubMap[p.platform] = p.publishedUrl;
              }
            });
            setClipPublishMap(prev => ({ ...prev, [targetClipId]: pubMap }));
          }
        } catch (e) {}

        try {
          const res = await fetch('/api/social/generate-metadata', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              streamerName: clipData.streamer,
              headlineHook: clipData.hook || clipData.clipTitle,
              transcriptSnippet: clipData.transcript,
              gameOrTopic: clipData.topic,
              platform: 'both'
            })
          });
          const data = await res.json();
          if (data.success && data.metadata) {
            setSocialPublishModal(prev => ({
              ...prev,
              isGeneratingMetadata: false,
              metadata: data.metadata
            }));
          } else {
            setSocialPublishModal(prev => ({ ...prev, isGeneratingMetadata: false }));
          }
        } catch (err) {
          console.warn('AI metadata generation error:', err);
          setSocialPublishModal(prev => ({ ...prev, isGeneratingMetadata: false }));
        }
      };

      const handleExecuteSocialPublish = async () => {
        if (!socialPublishModal.clipUrl) {
          showAppModal({ title: 'Missing Video', message: 'No video file selected for publishing.', type: 'error' });
          return;
        }

        const selectedPlatforms = socialPublishModal.platform === 'both'
          ? ['youtube', 'instagram']
          : [socialPublishModal.platform];

        setSocialPublishModal(prev => ({ ...prev, isPublishing: true, publishResults: null }));

        try {
          const res = await fetch('/api/social/publish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              clipId: socialPublishModal.clipId || `clip_${Date.now()}`,
              sourcePage: socialPublishModal.sourcePage || 'studio',
              videoPath: socialPublishModal.clipUrl,
              platforms: selectedPlatforms,
              title: socialPublishModal.metadata.youtubeTitle,
              description: socialPublishModal.metadata.youtubeDescription,
              caption: socialPublishModal.metadata.instagramCaption,
              hashtags: socialPublishModal.metadata.trendingHashtags,
              youtubeTags: socialPublishModal.metadata.youtubeTags || [socialPublishModal.streamer, 'shorts', 'gaming'],
              privacy: socialPublishModal.privacyStatus,
              streamer: {
                streamerName: socialPublishModal.streamer,
                streamerHandle: socialPublishModal.streamerHandle,
                gameOrTopic: socialPublishModal.topic
              }
            })
          });
          const data = await res.json();
          if (data.success && data.results) {
            setSocialPublishModal(prev => ({
              ...prev,
              isPublishing: false,
              publishResults: data.results
            }));
            fetchSocialAccounts();
            fetchPublishingHistory();
            const mapUpdate = {};
            data.results.forEach(r => {
              if (r.status === 'published' && r.publishedUrl) {
                if (!mapUpdate[socialPublishModal.clipId]) mapUpdate[socialPublishModal.clipId] = {};
                mapUpdate[socialPublishModal.clipId][r.platform] = r.publishedUrl;
              }
            });
            setClipPublishMap(prev => ({ ...prev, ...mapUpdate }));
          } else {
            setSocialPublishModal(prev => ({ ...prev, isPublishing: false }));
            showAppModal({ title: 'Publishing Failed', message: data.error || 'Failed to publish video.', type: 'error' });
          }
        } catch (err) {
          setSocialPublishModal(prev => ({ ...prev, isPublishing: false }));
          showAppModal({ title: 'Publish Error', message: err.message || 'Network error occurred.', type: 'error' });
        }
      };

      const handleSaveSocialAccount = async () => {
        try {
          const res = await fetch('/api/social/connect-account', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              platform: accountConnectModal.platform,
              details: {
                handle: accountConnectModal.handle || (accountConnectModal.platform === 'youtube' ? '@mychannel' : '@myprofile'),
                channelName: accountConnectModal.channelName || (accountConnectModal.platform === 'youtube' ? 'My YouTube Channel' : 'My Instagram Profile'),
                subscribers: accountConnectModal.subscribers || '10.5K',
                accessToken: accountConnectModal.apiKey || 'local_verified_token'
              }
            })
          });
          const data = await res.json();
          if (data.success) {
            setSocialAccounts(data.accounts);
            setAccountConnectModal({ isOpen: false, platform: 'youtube', handle: '', channelName: '', subscribers: '', apiKey: '' });
            showAppModal({ title: 'Connected!', message: `Successfully connected ${accountConnectModal.platform === 'youtube' ? 'YouTube Channel' : 'Instagram Profile'}!`, type: 'success' });
          }
        } catch (err) {
          showAppModal({ title: 'Connection Failed', message: err.message, type: 'error' });
        }
      };

      const handleDisconnectSocialAccount = async (platform) => {
        try {
          const res = await fetch('/api/social/disconnect-account', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },

          const data = await res.json();
          if (data.success) {
            setSocialAccounts(data.accounts);
            showAppModal({ title: 'Disconnected', message: `${platform === 'youtube' ? 'YouTube' : 'Instagram'} account disconnected.`, type: 'info' });
          }
        } catch (err) {
          showAppModal({ title: 'Error', message: err.message, type: 'error' });
        }
      };

      // ================= PAPER STYLE ANIMATION STUDIO STATE ================= //
      const [paperTopicQuery, setPaperTopicQuery] = useState('');
      const [paperIdeas, setPaperIdeas] = useState([]);
      const [selectedPaperIdea, setSelectedPaperIdea] = useState(null);
      const [paperDuration, setPaperDuration] = useState(30);
      const [paperCustomDuration, setPaperCustomDuration] = useState('');
      const [paperAspectRatio, setPaperAspectRatio] = useState('9:16');
      const [paperPlan, setPaperPlan] = useState(null);
      const [isPaperLoading, setIsPaperLoading] = useState(false);
      const [paperCopiedKey, setPaperCopiedKey] = useState(null);
      const [isPaperRendering, setIsPaperRendering] = useState(false);
      const [paperRenderJob, setPaperRenderJob] = useState(null);
      const [paperRenderedVideoUrl, setPaperRenderedVideoUrl] = useState(null);
      const [paperVoice, setPaperVoice] = useState('af_heart');
      const [paperBgm, setPaperBgm] = useState('/audio/bgm/ambient_documentary.wav');
      const [paperSfxEnabled, setPaperSfxEnabled] = useState(true);

      const handleFetchPaperIdeas = async (customQ) => {
        setIsPaperLoading(true);
        try {
          const res = await fetch('/api/paper-studio/ideas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: customQ !== undefined ? customQ : paperTopicQuery })
          });
          const data = await res.json();
          if (data.ideas && data.ideas.length > 0) {
            setPaperIdeas(data.ideas);
            setSelectedPaperIdea(data.ideas[0]);
            setPaperPlan(null);
            setPaperRenderedVideoUrl(null);
            setPaperRenderJob(null);
          }
        } catch (e) {
          showAppModal({
            title: 'Idea Generation Error',
            message: e.message || 'Failed to fetch paper ideas',
            type: 'error'
          });
        } finally {
          setIsPaperLoading(false);
        }
      };

      const handleGeneratePaperPlan = async (chosenIdea) => {
        const targetIdea = chosenIdea || selectedPaperIdea;
        if (!targetIdea) return;
        setIsPaperLoading(true);
        setPaperRenderedVideoUrl(null);
        setPaperRenderJob(null);
        try {
          const dur = paperCustomDuration ? parseInt(paperCustomDuration, 10) : paperDuration;
          if (dur % 10 !== 0) {
            showAppModal({
              title: 'Invalid Duration',
              message: 'Duration must be a multiple of 10 seconds (e.g. 10s, 20s, 30s, 40s, 50s, 60s)!',
              type: 'info'
            });
            setIsPaperLoading(false);
            return;
          }
          const res = await fetch('/api/paper-studio/plan', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              idea: targetIdea,
              duration: dur,
              aspectRatio: paperAspectRatio
            })
          });
          const data = await res.json();
          if (data.plan) {
            setPaperPlan(data.plan);
          }
        } catch (e) {
          showAppModal({
            title: 'Plan Generation Error',
            message: e.message || 'Failed to build production plan',
            type: 'error'
          });
        } finally {
          setIsPaperLoading(false);
        }
      };

      const handleRenderPaperVideo = async () => {
        if (!paperPlan) return;
        setIsPaperRendering(true);
        setPaperRenderedVideoUrl(null);
        try {
          const res = await fetch('/api/paper-studio/render', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              plan: paperPlan,
              voice: paperVoice,
              musicTrack: paperBgm,
              sfxEnabled: paperSfxEnabled
            })
          });
          if (!res.ok) {
            const errText = await res.text();
            let parsed;
            try { parsed = JSON.parse(errText); } catch (e) {}
            throw new Error(parsed?.error || parsed?.message || `Server returned ${res.status}`);
          }
          const contentType = res.headers.get('content-type') || '';
          if (!contentType.includes('application/json')) {
            throw new Error('Studio API server is starting up or unreachable on port 3000. Please wait 5 seconds and click Render again.');
          }
          const data = await res.json();
          if (data.job) {
            setPaperRenderJob(data.job);
            const pollInterval = setInterval(async () => {
              try {
                const sRes = await fetch(`/api/paper-studio/render-status/${data.job.id}`);
                if (!sRes.ok) return;
                const sContentType = sRes.headers.get('content-type') || '';
                if (!sContentType.includes('application/json')) return;
                const sData = await sRes.json();
                if (sData.job) {
                  setPaperRenderJob(sData.job);
                  if (sData.job.status === 'completed') {
                    clearInterval(pollInterval);
                    setIsPaperRendering(false);
                    setPaperRenderedVideoUrl(sData.job.videoUrl);
                  } else if (sData.job.status === 'failed') {
                    clearInterval(pollInterval);
                    setIsPaperRendering(false);
                    showAppModal({
                      title: 'Render Error',
                      message: sData.job.error || 'Failed to render paper explainer video.',
                      type: 'error'
                    });
                  }
                }
              } catch (pollErr) {
                console.warn('Poll error:', pollErr);
              }
            }, 1500);
          } else {
            setIsPaperRendering(false);
            showAppModal({
              title: 'Render Error',
              message: data.error || 'Failed to start video rendering job',
              type: 'error'
            });
          }
        } catch (err) {
          setIsPaperRendering(false);
          showAppModal({
            title: 'Network Error',
            message: err.message,
            type: 'error'
          });
        }
      };

      const copyToClipboard = (text, key) => {
        navigator.clipboard.writeText(text);
        setPaperCopiedKey(key);
        setTimeout(() => setPaperCopiedKey(null), 2000);
      };

      // ================= STREAM CHAT VIRAL CLIPPER STATE ================= //
      const [streamPresets, setStreamPresets] = useState([]);
      const [streamRegionTab, setStreamRegionTab] = useState('indian'); // 'indian' | 'foreign' | 'custom'
      const [selectedStreamer, setSelectedStreamer] = useState(null);
      const [selectedStreamerIds, setSelectedStreamerIds] = useState([]);
      const [isRefreshingRadar, setIsRefreshingRadar] = useState(false);
      const [streamUrlInput, setStreamUrlInput] = useState('');
      const [streamTopCount, setStreamTopCount] = useState(5);
      const [streamBeforeSec, setStreamBeforeSec] = useState(20);
      const [streamAfterSec, setStreamAfterSec] = useState(10);
      const [streamGapSec, setStreamGapSec] = useState(90);
      const [streamMinMultiplier, setStreamMinMultiplier] = useState(3.0);
      const [streamCropMode, setStreamCropMode] = useState('split_speed_60_40'); // 'split_speed_60_40' | 'split_50_50' | 'split_30_70' | 'split_70_30' | 'blur_pad' | 'center_crop' | 'smart_zoom' | 'square_1_1' | 'source_16_9'
      const [streamCamPosition, setStreamCamPosition] = useState('auto_detect'); // 'auto_detect' | 'top_left' | 'top_right' | 'bottom_left' | 'bottom_right' | 'auto_center'
      const [streamCaptionStyle, setStreamCaptionStyle] = useState('speed_center'); // 'speed_center' | 'yellow_black' | 'white_black' | 'bottom_standard' | 'center_only'
      const [streamBlurIntensity, setStreamBlurIntensity] = useState('medium'); // 'subtle' | 'medium' | 'heavy'
      const [momentFramingOverrides, setMomentFramingOverrides] = useState({});
      const [batchRenderProgress, setBatchRenderProgress] = useState(null);
      const [isStreamAnalyzing, setIsStreamAnalyzing] = useState(false);
      const [streamAnalysisResult, setStreamAnalysisResult] = useState(null);
      const [streamRenderingRank, setStreamRenderingRank] = useState(null);
      const [renderedStreamClips, setRenderedStreamClips] = useState({});
      const [isStreamBatchRendering, setIsStreamBatchRendering] = useState(false);
      const [batchStreamersStatus, setBatchStreamersStatus] = useState(null);
      const [streamRenderErrors, setStreamRenderErrors] = useState({});

      const fetchStreamPresets = async (forceRefresh = false) => {
        setIsRefreshingRadar(true);
        try {
          const res = await fetch(`/api/stream-clipper/presets${forceRefresh ? '?refresh=true' : ''}`);
          const data = await res.json();
          if (data.presets && data.presets.length > 0) {
            setStreamPresets(data.presets);
            // Default select top ranked or live streamer
            const topIndian = data.presets.find(p => p.region === 'indian');
            if (topIndian && !selectedStreamer) {
              setSelectedStreamer(topIndian);
              setStreamUrlInput(topIndian.active_stream_url || topIndian.channel_url);
            }
          }
        } catch (e) {
          console.error('Failed to fetch stream radar presets:', e);
        } finally {
          setIsRefreshingRadar(false);
        }
      };

      const handleSelectStreamer = (streamer) => {
        setSelectedStreamer(streamer);
        setStreamUrlInput(streamer.active_stream_url || streamer.channel_url || '');
        setStreamAnalysisResult(null);
        setRenderedStreamClips({});
      };

      const toggleSelectStreamerId = (id) => {
        setSelectedStreamerIds(prev => 
          prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
        );
      };

      const handleOneClickAutoClip = async (streamer) => {
        setSelectedStreamer(streamer);
        const targetUrl = streamer.active_stream_url || streamer.channel_url;
        setStreamUrlInput(targetUrl);
        setStreamAnalysisResult(null);
        setRenderedStreamClips({});
        setIsStreamAnalyzing(true);

        try {
          const res = await fetch('/api/stream-clipper/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              url: targetUrl,
              region: streamer.region || 'all',
              top: streamTopCount,
              before: streamBeforeSec,
              after: streamAfterSec,
              gap: streamGapSec,
              multiplier: streamMinMultiplier,
              isDemo: !targetUrl.includes('http') || targetUrl.includes('/@'),
              streamerName: streamer.name
            })
          });
          const data = await res.json();
          if (!res.ok || data.error) throw new Error(data.error || 'Chat analysis failed');
          setStreamAnalysisResult(data);

          // Automatically render ALL moments sequentially in the background!
          if (data.moments && data.moments.length > 0) {
            autoRenderAllMoments(data.moments, data);
          }
        } catch (e) {
          showAppModal({
            title: 'Auto-Clip Notice',
            message: e.message || 'Stream chat analysis completed with sample highlights.',
            type: 'info'
          });
        } finally {
          setIsStreamAnalyzing(false);
          setStreamRenderingRank(null);
        }
      };

      const handleBatchClipMultiple = async (streamersToClip) => {
        if (!streamersToClip || streamersToClip.length === 0) {
          showAppModal({
            title: 'No Streamers Selected',
            message: 'Please check at least one streamer card to run batch auto-clipping.',
            type: 'warning'
          });
          return;
        }

        setIsStreamBatchRendering(true);
        setBatchStreamersStatus({ total: streamersToClip.length, current: 0, streamerName: '' });

        try {
          const list = streamersToClip.map(s => ({
            id: s.id,
            name: s.name,
            url: s.active_stream_url || s.channel_url,
            region: s.region
          }));

          const res = await fetch('/api/stream-clipper/batch-clip', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              streamers: list,
              topPerStreamer: 2,
              cropMode: streamCropMode,
              isDemo: false
            })
          });
          const data = await res.json();
          if (data.success && data.results) {
            showAppModal({
              title: 'Batch Auto-Clip Complete! 🎉',
              message: `Successfully processed ${data.count} streamers and rendered ${data.results.reduce((acc, r) => acc + r.renderedClips.length, 0)} vertical reels! All clips saved in output/stream_clips/ ready for download.`,
              type: 'success'
            });
          }
        } catch (e) {
          showAppModal({
            title: 'Batch Error',
            message: e.message || 'Batch multi-streamer clipping encountered an error.',
            type: 'error'
          });
        } finally {
          setIsStreamBatchRendering(false);
          setBatchStreamersStatus(null);
        }
      };

      const handleAnalyzeStream = async (forceDemo = false) => {
        setIsStreamAnalyzing(true);
        setStreamAnalysisResult(null);
        setRenderedStreamClips({});
        try {
          const isCustom = Boolean(streamUrlInput.trim());
          const targetUrl = streamUrlInput.trim() || selectedStreamer?.active_stream_url || selectedStreamer?.channel_url || '';
          const res = await fetch('/api/stream-clipper/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              url: targetUrl,
              region: streamRegionTab === 'custom' ? 'all' : streamRegionTab,
              top: streamTopCount,
              before: streamBeforeSec,
              after: streamAfterSec,
              gap: streamGapSec,
              multiplier: streamMinMultiplier,
              isDemo: forceDemo || (!targetUrl.includes('http') && !targetUrl.includes('.')),
              streamerName: isCustom ? '' : (selectedStreamer?.name || '')
            })
          });
          const data = await res.json();
          if (!res.ok || data.error) {
            throw new Error(data.error || 'Failed to analyze stream chat');
          }
          if (isCustom && data.streamerName) {
            setSelectedStreamer({
              id: 'custom_streamer',
              name: data.streamerName,
              subscribers: 'Live Stream Channel',
              avatar: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=100&h=100&fit=crop',
              active_stream_url: targetUrl,
              channel_url: targetUrl,
              status: 'live'
            });
          }
          setStreamAnalysisResult(data);
          setIsStreamAnalyzing(false);

          // Automatically render ALL moments sequentially in the background!
          if (data.moments && data.moments.length > 0) {
            autoRenderAllMoments(data.moments, data);
          }
        } catch (e) {
          showAppModal({
            title: 'Stream Chat Analysis Failed',
            message: e.message || 'Could not fetch stream chat. You can use the "Instant Simulation / Demo Test" button to verify the peak detector immediately!',
            type: 'error'
          });
        } finally {
          setIsStreamAnalyzing(false);
          setStreamRenderingRank(null);
        }
      };

      const handleRenderStreamClip = async (moment, customAnalysis = null) => {
        setStreamRenderingRank(moment.rank);
        setStreamRenderErrors(prev => ({ ...prev, [moment.rank]: null }));
        const override = momentFramingOverrides[moment.rank] || {};
        const chosenCropMode = override.cropMode || streamCropMode;
        const chosenBlur = override.blurIntensity || streamBlurIntensity;
        const chosenCam = override.camPosition || streamCamPosition;
        const chosenCaptionStyle = override.captionStyle || streamCaptionStyle;

        const effectiveAnalysis = customAnalysis || streamAnalysisResult;
        const targetUrl = effectiveAnalysis?.url || streamUrlInput.trim() || '';
        const streamerName = effectiveAnalysis?.streamerName || selectedStreamer?.name || 'Creator';
        const isDemo = Boolean(effectiveAnalysis?.isDemo || targetUrl === 'Demo Stream Simulation' || !targetUrl.includes('http'));

        try {
          let res;
          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              res = await fetch('/api/stream-clipper/render-clip', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  url: targetUrl,
                  moment,
                  streamerName,
                  cropMode: chosenCropMode,
                  blurIntensity: chosenBlur,
                  camPosition: chosenCam,
                  captionStyle: chosenCaptionStyle,
                  isDemo
                })
              });
              if (res.ok) break;
            } catch (netErr) {
              if (attempt < 3) {
                console.warn(`[StreamClipper] Network hiccup on attempt ${attempt}, retrying in 2.5s...`, netErr);
                await new Promise(r => setTimeout(r, 2500));
              } else {
                throw netErr;
              }
            }
          }
          if (!res) throw new Error('Could not establish connection to video processing server.');
          const data = await res.json();
          if (!res.ok || !data.success) {
            throw new Error(data.error || 'Failed to render clip');
          }
          setRenderedStreamClips(prev => ({
            ...prev,
            [moment.rank]: {
              ...data,
              appliedCropMode: chosenCropMode,
              appliedCamPosition: chosenCam,
              appliedBlur: chosenBlur
            }
          }));
          return data;
        } catch (e) {
          console.error(`Clip Render Error on rank ${moment.rank}:`, e);
          setStreamRenderErrors(prev => ({ ...prev, [moment.rank]: e.message || 'Render failed. Check terminal logs.' }));
          return null;
        } finally {
          setStreamRenderingRank(null);
        }
      };

      const autoRenderAllMoments = async (momentsList, analysisData) => {
        if (!momentsList || momentsList.length === 0) return;
        setIsStreamBatchRendering(true);
        try {
          for (let i = 0; i < momentsList.length; i++) {
            const m = momentsList[i];
            setBatchRenderProgress({
              current: i + 1,
              total: momentsList.length,
              title: m.headline_hook || `Moment #${m.rank}`
            });
            await handleRenderStreamClip(m, analysisData);
          }
        } catch (err) {
          console.warn('[StreamClipper] Auto-render all moments encountered error:', err);
        } finally {
          setIsStreamBatchRendering(false);
          setBatchRenderProgress(null);
          setStreamRenderingRank(null);
        }
      };

      const handleRenderAllStreamClips = async (momentsList = null, analysisData = null) => {
        const moments = momentsList || streamAnalysisResult?.moments;
        const analysis = analysisData || streamAnalysisResult;
        if (!moments?.length) return;
        setIsStreamBatchRendering(true);
        const newlyRendered = [];
        
        try {
          for (let i = 0; i < moments.length; i++) {
            const m = moments[i];
            setBatchRenderProgress({ current: i + 1, total: moments.length, title: m.headline_hook });
            if (!renderedStreamClips[m.rank]) {
              const res = await handleRenderStreamClip(m, analysis);
              if (res && res.clipUrl) {
                newlyRendered.push({ rank: m.rank, url: res.clipUrl });
              }
            } else {
              newlyRendered.push({ rank: m.rank, url: renderedStreamClips[m.rank].clipUrl });
            }
          }

          if (newlyRendered.length > 0) {
            newlyRendered.forEach((clip, index) => {
              setTimeout(() => {
                const link = document.createElement('a');
                link.href = clip.url;
                link.download = `stream_moment_${clip.rank}_9x16.mp4`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
              }, index * 800);
            });

            showAppModal({
              title: 'Batch Render & Multiple Download Complete! 🚀',
              message: `Successfully rendered all ${newlyRendered.length} clips with chosen framing! All MP4 files are downloading automatically.`,
              type: 'success'
            });
          }
        } finally {
          setIsStreamBatchRendering(false);
          setBatchRenderProgress(null);
        }

          if (e.lengthComputable) {
            const pct = Math.round((e.loaded / e.total) * 60);
            setClipperProgress(15 + pct);

        xhr.onload = () => {

              fetchClipperProjects();
              if (res.id) loadClipperProject(res.id);
            } catch (err) {
              setClipperError('Failed to parse upload response: ' + err.message);
              setIsClipperBusy(false);

          setClipperError('Network error uploading video');
          setIsClipperBusy(false);
